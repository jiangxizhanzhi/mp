plugins {
    id 'org.springframework.boot' version '2.5.12'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
    id 'application'
    id 'org.flywaydb.flyway' version '8.0.5'
    id "com.thinkimi.gradle.MybatisGenerator" version "2.3"
}




ext['tomcat.version'] = '9.0.58'
ext['logback.version'] = '1.2.10'
ext['log4j2.version'] = '2.18.0'
apply from: 'mp/config.gradle'

allprojects {
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java'
    apply plugin: 'application'
    apply plugin: 'org.flywaydb.flyway'


    group = 'cn.cyberpeace.mp'
    version = gradle.ext.version
    sourceCompatibility = '11'
    mainClassName = 'cn.cyberpeace.mp.Application'

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    repositories {
        maven { url 'https://repo.spring.io/release' }
        mavenCentral()
    }

    ext {
        set('snippetsDir', file("build/generated-snippets"))
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-websocket'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-aop'
        implementation 'org.springframework.boot:spring-boot-starter-validation:2.5.0'
        implementation 'org.springframework.boot:spring-boot-starter-amqp'
        implementation 'org.springframework.boot:spring-boot-starter-cache'
        implementation 'com.github.ben-manes.caffeine:caffeine'
        implementation 'org.elasticsearch:elasticsearch:7.14.2'
        implementation 'org.elasticsearch.client:elasticsearch-rest-high-level-client:7.14.2'
        implementation 'org.flywaydb:flyway-core:8.0.5'
        implementation 'com.google.guava:guava:30.1.1-jre'
        implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.1.4'
        implementation 'org.apache.commons:commons-lang3:3.11'
        implementation 'com.alibaba:fastjson:1.2.83'
        implementation 'org.apache.commons:commons-collections4:4.1'
        implementation 'io.springfox:springfox-swagger2:3.0.0'
        implementation 'com.github.xiaoymin:knife4j-spring-boot-starter:3.0.2'
        implementation 'cn.hutool:hutool-all:5.6.6'
        implementation 'commons-net:commons-net:3.6'
        implementation 'commons-io:commons-io:2.11.0'
        implementation 'commons-codec:commons-codec:1.15'
        implementation 'org.mongodb:bson:4.7.0'
        implementation 'org.mongodb:mongodb-driver-core:4.7.0'
        implementation 'org.mongodb:mongodb-driver-sync:4.7.0'
        implementation 'org.slf4j:slf4j-api:1.7.30'
        implementation 'com.alibaba:easyexcel:3.1.1'
        compileOnly 'org.projectlombok:lombok'
        runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mybatis.generator:mybatis-generator-core:1.3.7'
        implementation 'org.mitre.dsmiley.httpproxy:smiley-http-proxy-servlet:1.12.1'
        implementation 'com.github.pagehelper:pagehelper-spring-boot-starter:1.2.5'
        implementation 'commons-io:commons-io:2.6'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.security:spring-security-test'
        implementation 'com.auth0:java-jwt:3.15.0'
        implementation 'com.github.jsqlparser:jsqlparser:0.9.5'
        implementation('org.apache.httpcomponents:httpmime:4.4.1')
        implementation('com.squareup.okhttp3:okhttp:3.14.6')
        implementation 'net.oschina.zcx7878:fastdfs-client-java:1.27.0.0'
        implementation 'org.apache.commons:commons-pool2:2.4.2'
        implementation 'com.hierynomus:sshj:0.34.0'
        implementation 'org.mapstruct:mapstruct:1.4.2.Final'
        implementation 'com.github.oshi:oshi-core:5.3.6'
        implementation 'io.github.hakky54:sslcontext-kickstart:6.6.0'
        implementation 'org.mariadb.jdbc:mariadb-java-client:2.7.2'
        testImplementation group: 'org.mockito', name: 'mockito-core', version: '3.3.3'
    }


    test {
        outputs.dir snippetsDir
        useJUnitPlatform()
    }

    bootJar {
        enabled = false
    }

    jar {
        enabled = true
    }

    bootBuildImage {
        builder = 'paketobuildpacks/builder:tiny'
        environment = ['BP_NATIVE_IMAGE': 'true']
    }
}
