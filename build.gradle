plugins {
    id 'org.springframework.boot' version '2.7.14'
    id 'io.spring.dependency-management' version '1.1.2'
    id 'java'
    id 'application'
    id 'org.flywaydb.flyway' version '8.5.13'
    id "com.thinkimi.gradle.MybatisGenerator" version "2.3"
}

ext['tomcat.version'] = '9.0.78'
ext['logback.version'] = '1.2.12'
ext['log4j2.version'] = '2.20.0'
apply from: 'mp/config.gradle'

allprojects {
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/public/'
        }
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java'
    apply plugin: 'application'
    apply plugin: 'org.flywaydb.flyway'

    group = 'cn.cyberpeace.mp'
    version = gradle.ext.version
    sourceCompatibility = '11'
    mainClassName = 'cn.cyberpeace.mp.Application'

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    repositories {
        maven { url 'https://repo.spring.io/release' }
        mavenCentral()
    }

    ext {
        set('snippetsDir', file("build/generated-snippets"))
    }

    dependencies {
        implementation 'cn.hutool:hutool-all:5.8.21'
        implementation 'com.alibaba:easyexcel:3.3.2'
        implementation 'com.alibaba:fastjson:1.2.83'
        implementation 'com.auth0:java-jwt:3.19.4'
        implementation 'com.github.ben-manes.caffeine:caffeine:3.1.7'
        implementation 'com.github.oshi:oshi-core:5.8.7'
        implementation 'com.github.pagehelper:pagehelper-spring-boot-starter:1.4.7'
        implementation 'com.oopsguy.kaptcha:kaptcha-spring-boot-starter:1.0.0-beta-2'
        implementation 'com.github.xiaoymin:knife4j-spring-boot-starter:3.0.3'
        implementation 'com.google.guava:guava:32.0.1-jre'
        implementation 'com.hierynomus:sshj:0.35.0'
        implementation 'com.squareup.okhttp3:okhttp:3.14.9'
        implementation 'commons-codec:commons-codec:1.16.0'
        implementation 'commons-io:commons-io:2.13.0'
        implementation 'commons-net:commons-net:3.9.0'
        implementation 'io.github.hakky54:sslcontext-kickstart:6.8.0'
        implementation 'io.springfox:springfox-swagger2:3.0.0'
        implementation 'net.oschina.zcx7878:fastdfs-client-java:1.27.0.0'
        implementation 'org.apache.commons:commons-collections4:4.4'
        implementation 'org.apache.commons:commons-lang3:3.13.0'
        implementation 'org.apache.commons:commons-pool2:2.11.1'
        implementation 'org.apache.commons:commons-compress:1.23.0'
        implementation 'org.apache.httpcomponents:httpmime:4.5.14'
        implementation ('org.elasticsearch.client:elasticsearch-rest-high-level-client:7.17.12') {
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
            exclude group: 'org.yaml', module: 'snakeyaml'
        }
        implementation ('org.elasticsearch:elasticsearch:7.17.12') {
            exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
            exclude group: 'org.yaml', module: 'snakeyaml'
        }
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.7.1'
        implementation 'org.yaml:snakeyaml:1.33'
        implementation 'org.flywaydb:flyway-core:8.5.13'
        implementation 'org.mapstruct:mapstruct:1.5.5.Final'
        implementation 'org.mariadb.jdbc:mariadb-java-client:2.7.9'
        implementation 'org.mitre.dsmiley.httpproxy:smiley-http-proxy-servlet:1.12.1'
        implementation 'org.mongodb:bson:4.10.2'
        implementation 'org.mongodb:mongodb-driver-core:4.10.2'
        implementation 'org.mongodb:mongodb-driver-sync:4.10.2'
        implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.1'
        implementation 'org.slf4j:slf4j-api:1.7.36'
        implementation 'org.springframework.boot:spring-boot-starter-actuator:2.7.14'
        implementation 'org.springframework.boot:spring-boot-starter-amqp:2.7.14'
        implementation 'org.springframework.boot:spring-boot-starter-aop:2.7.14'
        implementation 'org.springframework.boot:spring-boot-starter-cache:2.7.14'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc:2.7.14'
        implementation 'org.springframework.boot:spring-boot-starter-security:2.7.14'
        implementation 'org.springframework.boot:spring-boot-starter-validation:2.7.14'
        implementation 'org.springframework.boot:spring-boot-starter-web:2.7.14'
        implementation 'org.springframework.boot:spring-boot-starter-websocket:2.7.14'
        implementation 'org.springframework.security:spring-security-test:5.8.5'
        implementation 'org.springframework.security:spring-security-config:5.8.5'
        implementation 'org.springframework.security:spring-security-core:5.8.5'
        implementation 'org.springframework.security:spring-security-crypto:5.8.5'
        implementation 'org.springframework.security:spring-security-web:5.8.5'
        implementation 'com.jcraft:jsch:0.1.55'
        implementation 'net.java.dev.jna:jna:5.13.0'
        implementation 'net.java.dev.jna:jna-platform:5.13.0'
        annotationProcessor 'org.projectlombok:lombok'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
        runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
        compileOnly 'org.projectlombok:lombok:1.18.28'
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.1'
        testImplementation 'org.mockito:mockito-core:3.3.3'
        testImplementation 'org.mybatis.generator:mybatis-generator-core:1.3.7'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    }

    test {
        outputs.dir snippetsDir
        useJUnitPlatform()
    }

    bootJar {
        enabled = false
    }

    jar {
        enabled = true
    }

    bootBuildImage {
        builder = 'paketobuildpacks/builder:tiny'
        environment = ['BP_NATIVE_IMAGE': 'true']
    }
}
