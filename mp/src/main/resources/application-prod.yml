ip:
  moloch: ${MOLOCH_IP:127.0.0.1}        # moloch的IP地址
  wazuh: ${WAZUH_IP:127.0.0.1}          # wazuh的IP地址
  log-es: ${LOG_ES_IP:127.0.0.1}        # 日志es
port:
  log-es: ${LOG_ES_PORT:9200}
server:
  servlet:
    context-path: /api/mp
  port: 8080

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  web:
    resources:
      static-locations: file:/root/.mp/resources/default_img
  elasticsearch:
    rest:
      uris: ${ip.log-es}:${port.log-es}
      read-timeout: 30s
      connection-timeout: 5s


logging:
  config: classpath:logback-spring-prod.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs
    max-file-size: ${MP_LOGFILE_MAX_FILE_SIZE:300MB}
    max-total-size: ${MP_LOGFILE_MAX_TOTAL_SIZE:650MB}
    max-row-length: ${LOG_FILE_MAX_ROW_LENGTH:20000}
  logback:
    rollingpolicy:
      max-history: ${MP_LOGFILE_MAX_HISTORY:15}
springfox:
  documentation:
    enabled: ${SWAGGER_DOC_ENABLED:true}
    auto-startup: ${SWAGGER_DOC_STARTUP:true}
    swagger-ui:
      enabled: ${SWAGGER_DOC_UI:true}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 请求云平台组信息的url配置，必需填写
mp:
  situationaware:
    #moloch es节点地址
    es-node: ${ip.moloch}:${MOLOCH_PORT:9205}
    wazuh:
      #wazuh 开放接口地址
      base-url: http://${ip.wazuh}:${WAZUH_PORT:15500}
      #wazuh 开放接口用户名密码
      username: ${WAZUH_USERNAME:wazuh}
      password: ${WAZUH_PASSWORD:Abcd123#}
  log:
    es-nodes: ${ip.log-es}:${LOG_ES_PORT:9205}
    exclude-uri: /login
    exclude-method: OPTIONS

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings, caches, env, scheduledtasks
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false


---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs



---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: /home/mp/logs
