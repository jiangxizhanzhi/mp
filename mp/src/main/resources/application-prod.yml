ip:
  self: ${MP_SELF_IP:mp}                    # mp自身地址
  mariadb: ${MP_DB_IP:10.100.0.101}         # MP新中台mariadb数据库地址
  fdfs: ${FDFS_IP:10.100.1.26}           # FastDFS地址
  cp: ${CP_IP:10.100.7.1}                # 云平台适配层接口地址
  moloch: ${MOLOCH_IP:10.100.0.101}        # moloch的IP地址
  wazuh: ${WAZUH_IP:10.100.7.1}          # wazuh的IP地址
  rabbitmq: ${RABBITMQ_IP:10.100.0.101}           # rabbitmq地址
  log-es: ${LOG_ES_IP:10.100.0.101}        # 日志es
  mp: ${MP_API_IP_PORT:10.100.1.12:8001}                       # MP中台API地址
port:
  self-callback: ${MP_SELF_PORT:8080}
server:
  servlet:
    context-path: /api/mp
  port: 8080
  tomcat:
    threads:
      min-spare: ${MP_TOMCAT_MIN_POOL_SIZE:10}
      max: ${MP_TOMCAT_MAX_POOL_SIZE:200}


spring:
  datasource:
    url: jdbc:mysql://${ip.mariadb}:${MP_DB_PORT:3306}/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: ${MP_DB_USERNAME:root}
    password: ${MP_DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${MP_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${MP_DB_MIN_POOL_SIZE:10}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    clean-disabled: true
    enabled: ${MP_FLYWAY_ENABLED_VALUE:false}
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  rabbitmq:
    host: ${ip.rabbitmq}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  web:
    resources:
      static-locations: file:/root/.mp/resources/default_img


logging:
  config: classpath:logback-spring-prod.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs
    max-file-size: ${MP_LOGFILE_MAX_FILE_SIZE:300MB}
    max-total-size: ${MP_LOGFILE_MAX_TOTAL_SIZE:650MB}
    max-row-length: ${LOG_FILE_MAX_ROW_LENGTH:2000}
  logback:
    rollingpolicy:
      max-history: ${MP_LOGFILE_MAX_HISTORY:15}
springfox:
  documentation:
    enabled: ${SWAGGER_DOC_ENABLED:false}
    auto-startup: ${SWAGGER_DOC_STARTUP:false}
    swagger-ui:
      enabled: ${SWAGGER_DOC_UI:false}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 请求云平台组信息的url配置，必需填写
mp:
  base:
    fdfs-tracker-servers:
      - ${ip.fdfs}:${FDFS_TRACKER_SERVERS_PORT:22122}
    fdfs-inner-http-server: http://${ip.fdfs}:${FDFS_INNER_FILE_SERVER_PORT:8888}
    fdfs-outer-http-server: ${FDFS_FILE-SERVER-ADDR:/fdfs}
    run-init: true
  # mp-common 模块配置
  common:
    cp-url: http://${ip.cp}:${CP_PORT:11111} #云平台地址
    es-nodes: ${ip.log-es}:${LOG_ES_PORT:9205}
  # mp-devops-cluster 配置
  devops.cluster:
    cp-url: http://${ip.cp}:${CP_PORT:11111} #云平台地址
    public-net-proxy: ${MP_PUBLIC_NET_PROXY:false} #公网开关
    public-net-proxy-ip: ${MP_PUBLIC_NET_PROXY_IP:} #公网ip
    public-net-proxy-port: ${PUBLIC_NET_PROXY_PORT:} #公网端口
    public-net-proxy-server: ${MP_PUBLIC_NET_PROXY_SERVER:false}
    hostname: controller  #主机名称
    max-target-size: 100  # 承诺最大支持靶标的磁盘大小(G)
    disk-alarm-percent: ${MP_DEVOPS_DISK_ALARM_PERCENT:80} # 磁盘空间告警阈值
  # mp-situationaware 模块配置
  situationaware:
    # monitor
    cp_srv_monitors:
      - probe-name: monitor_cp_service.py
        launch-id: 093f61683e1a4e3fbe80664e791ea001
        interval: ${MP_MONITOR_CP_SRV_INTERVAL:180s}
        service-list: chronyd,dnsmasq,etcd,httpd,libvirtd,mariadb.service,memcached,nfs-server,nginx,openvswitch,kuryr-libnetwork,network,rabbitmq-server,rpcbind,supervisord,vsftpd,openstack-nova-api,openstack-nova-scheduler,openstack-nova-conductor,openstack-nova-novncproxy,openstack-nova-serialproxy,openstack-nova-compute,neutron-server,neutron-openvswitch-agent,neutron-dhcp-agent,neutron-metadata-agent,neutron-l3-agent,openstack-glance-api,openstack-cinder-api,openstack-cinder-volume
        restart-restrict-list: ${MP_MONITOR_CP_SRV_RESTART_RESTRICT_LIST_1:chronyd,dnsmasq,etcd,httpd,libvirtd,mariadb,memcached,nfs-server,nginx,openvswitch,kuryr-libnetwork,network,rabbitmq-server,rpcbind,supervisord,vsftpd}
      - probe-name: monitor_cp_service.py
        launch-id: 093f6512519d49b2986819e29e4ba002
        interval: ${MP_MONITOR_CP_SRV_INTERVAL:180s}
        service-list: docker,containerd,zun-api,zun-cni-daemon,zun-compute,zun-wsproxy,openstack-cinder-scheduler,cpcloud:celery,cpcloud:info,cpcloud:instance_control,cpcloud:logger_app,cpcloud:npc_node,cpcloud:probe,cpcloud:scheduler,cpcloud:sdn_app,cpcloud:sdn_base_vr,cpcloud:vpn,cpcloud:web,adaptation,cpcloud_guacamole,cpcloud_guacd,cpcloud_web-tty-client,fastdfs,mariadb,rabbitmq,redis,zabbix-server-mysql,zabbix-web-nginx-mysql
        restart-restrict-list: ${MP_MONITOR_CP_SRV_RESTART_RESTRICT_LIST_2:docker,containerd,adaptation,fastdfs,mariadb-docker,rabbitmq,redis}
    biz_srv_monitors:
      - probe-name: monitor_biz_service.py
        launch-id: 093fc7abba264d38a022a4c143d6a003
        interval: ${MP_MONITOR_BIZ_SRV_INTERVAL:180s}
        service-list: mp,mp_es,wazuh-manager,ad,bc,drm,PY-HOST
        restart-restrict-list: ${MP_MONITOR_BIZ_SRV_RESTART_RESTRICT_LIST:mp,mp_es,wazuh-manager}
    # arkime
    arkime-cpcloud-container-create-url: http://${ip.cp}:11111/v1
    arkime-cpcloud-network-mirror-url: http://${ip.cp}:11111/cpcloud/sdn_app/v1
    arkime-es-host: ${ip.moloch}
    arkime-es-port: ${ARKIME_PORT:9205}
    arkime-image-name: centos-arkime_arkime:v2
    arkime-username: api
    arkime-password: api
    #wazuh 开放接口地址用户名密码
    wazuh-base-url: http://${ip.wazuh}:${WAZUH_PORT:15500}
    wazuh-username: ${WAZUH_USERNAME:wazuh}
    wazuh-password: ${WAZUH_PASSWORD:Abcd123#}
    wazuh-flow-table-url: http://${ip.cp}:9999/knapsack/probe/v1
    # wazuh-probe-manager
    probe-mgr-url: http://${ip.wazuh}:${WAZUH_PORT:8002}
    probe-mgr-agent-script-linux-path: ${WAZUH_AGENT_SCRIPT_LINUX_PATH:/var/ossec/etc/shared/scripts/}
    probe-mgr-agent-script-windows-path: ${WAZUH_AGENT_SCRIPT_WINDOWS_PATH:C:\ossec-agent\shared\scripts\}
    probe-mgr-task-enable: true
    #moloch es节点地址
    es-nodes: ${ip.moloch}:${MOLOCH_PORT:9205}
    # es 日期格式
    es-date-pattern: ${ES-DATE-PATTERN:yyyy-MM-dd'T'HH:mm:ss.SSSZ}
  collection:
    #自定义探针配置
    probe:
      default-interval: 180s
      probes:
        - probe-name: get_host_info.py
          id: eda72998ba654c8d8625f61eaa918eb3
          interval: 180s
          outputFormat: plain
        - probe-name: get_net_conns.py
          id: 09ffcc4a67ef4accb407a1555629d0f8
          interval: 180s
          outputFormat: json
        - probe-name: get_env_values.py
          id: 32e9c4db9729440290e843bb6d80295b
          interval: 300s
          outputFormat: json
        - probe-name: get_processes.py
          id: 38949dcf3829489d8dd9e0e63cc66541
          interval: 180s
          outputFormat: json
        - probe-name: get_system_users.py
          id: 4894f48375ee4dd5b7a7bad7c1a78376
          interval: 180s
          outputFormat: json
    #日志采集地址配置
    location:
      locations:
        - probeId: '008'
          log-format: eventchannel
          location: Microsoft-Windows-PrintService/Operational,System,Microsoft-Windows-Sysmon/Operational
          os-type: windows
        - probeId: '008'
          log-format: syslog
          location: /var/log/syslog
          os-type: linux
        - probeId: '009'
          log-format: syslog
          location: /var/log/maillog,/var/log/httpd
          os-type: linux
        - probeId: '009'
          log-format: eventchannel
          location: Application,File Replication Service,Service Microsoft-Windows-TerminalServices-RemoteConnectionManager
          os-type: windows
        - probeId: '010'
          log-format: eventchannel
          location: Security,Microsoft-Windows-Windows Defender/Operational,Microsoft-Windows-Windows Firewall With Advanced Security/Firewall
          os-type: windows
        - probeId: '010'
          log-format: syslog
          location: /var/log/clamav.log,/var/log/secure
          os-type: linux
  # mp-devops-log 模块配置
  devops.log:
    exclude-uri:
      - /login
    exclude-method:
      - OPTIONS
  # auth 模块配置
  auth:
    max-import-user-size: ${MP_MAX_IMPORT_USER_SIZE:100}
    logout-reset-secret: ${MP_AUTH_LOGOUT_RESET_SECRET:true}
    default-User-Avatar: ${MP_AUTH_default_User_Avatar:/api/mp/avatar/1.png}
    # authenticate
    authenticate-cache-time: ${MP_AUTH_CACHE_TIME:30}
    authenticate-use-individual-token-secret: ${MP_AUTH_USE_INDIVIDUAL_TOKEN_SECRET:true}
    authenticate-jwt-secret: ${MP_AUTH_JWT_SECRET:}
    authenticate-jwt-expires: ${MP_AUTH_JWT_EXPIRES:604800}
    authenticate-urls: ${MP_AUTH_URLS:/auth/**,/sys/notice/**,/systemOperation/**,/flow/**,/cscene/**,/devops/**}
    authenticate-encoder-iterations: ${MP_AUTH_ENCODER_ITERATIONS:}
    authenticate-encoder-hash-width: ${MP_AUTH_ENCODER_HASHWIDTH:}
  # mp-front-admin 模块配置
  front.admin.activation:
    enable: true
    licenseDir: /home/mp/config/license
  # mp-front-business 模块配置
  front.biz:
    url-ac-filter-enabled: true
    url-ac-filter-method-match: true
    url-ac-filter-authority-match: true
    url-ac-filter-ignore-if-not-defined: false
  # mp-flow 模块配置
  flow:
    trex-image: ${TREX_IMAGE:tgn-trex}
  sceneplugincloud:
    cpcloud-server: http://${ip.cp}:${CP_PORT:11111}
    delete_retry_times: ${MP_DELETE_RETRY_TIMES:2}
    default_core_router_name: ${MP_DEFAULT_CORE_ROUTER_NAME:Router}
    enable_reallocate_ip_ports: ${MP_ENABLE_REALLOCATE_IP_PORTS:false}
    link_status_enabled: ${MP_LINK_STATUS_ENABLED:true}
    link_status_refresh_period: ${MP_LINK_STATUS_REFRESH_PERIOD:5}
    link_status_cache_seconds: ${MP_LINK_STATUS_CACHE_SECONDS:600}
    link_status_pool_size: ${MP_LINK_STATUS_POOL_SIZE:10}
    link_status_hold_size: ${MP_LINK_STATUS_HOLD_SIZE:200}
    public-net-proxy-server: ${MP_PUBLIC_NET_PROXY_SERVER:false}
    public-net-proxy: ${MP_PUBLIC_NET_PROXY:false}
    public-net-proxy-ip: ${MP_PUBLIC_NET_PROXY_IP:}
    public-net-proxy-port: ${PUBLIC_NET_PROXY_PORT:}
    gateway_types: ${GATEWAY_TYPES:2,3}
    cploud_http_pool_size: ${MP_CPLOUD_HTTP_POOL_SIZE:200}
    initiate_pool_size: ${MP_INITIATE_POOL_SIZE:10}
    initiate_hold_size: ${MP_INITIATE_HOLD_SIZE:20000}
    create_pool_size: ${MP_CREATE_POOL_SIZE:10}
    create_hold_size: ${MP_CREATE_HOLD_SIZE:20000}
    cloud_heavy_concurrent_delay_enable: ${MP_CLOUD_HEAVY_CONCURRENT_DELAY_ENABLE:true}
    cloud_heavy_concurrent_delay: ${MP_CLOUD_HEAVY_CONCURRENT_DELAY:10}
    scene_create_install_unzip_apk: ${MP_SCENE_CREATE_INSTALL_UNZIP_APK:true}
    dhcp_ip_allocate: ${MP_DHCP_IP_ALLOCATE:true}
  sceneplugincollection:
    wazuh-server-host: ${ip.wazuh}
    wazuh-api-server: http://${ip.wazuh}:15500
    wazuh-api-pass: Abcd123#
    wazuh-es-server: http://${ip.es}:9205
    wazuh-godfs-server: http://${ip.wazuh}:11888
    wazuh-godfs-outer-http-server: /mp_scene_collection_godfs
    wazuh-run-command-http-callback-url: http://${ip.self}:${port.self-callback}/api/mp/scene_plugin_collection/wazuh_run_command_result
  cscene:
    has-own-recording-set: ${HAS_OWN_RECORDING_SET:213,214,236}
    scene-error-creating-seconds: ${MP_SCENE_ERROR_CREATING_SECONDS:3600}
    element-error-creating-seconds: ${MP_ELEMENT_ERROR_CREATING_SECONDS:300}
    enable-scene-cron-job: ${MP_ENABLE_SCENE_CRON_JOB:true}
    enable-command-change: ${MP_ENABLE_COMMAND_CHANGE:false}
    cron-job-expression: ${MP_CRON_JOB_EXPRESSION:0 0/15 * * * ?}
    access-mode-ip: ${MP_ACCESS_MODE_IP:}
    enable_node_limit_db_check: ${MP_ENABLE_NODE_LIMIT_DB_CHECK:true}
  scene:
    access-mode-ip: ${MP_ACCESS_MODE_IP:}
    scene_pool_size: ${MP_SCENE_POOL_SIZE:100}
    scene_hold_size: ${MP_SCENE_HOLD_SIZE:10000}
    element_pool_size: ${MP_ELEMENT_POOL_SIZE:100}
    element_hold_size: ${MP_ELEMENT_HOLD_SIZE:10000}
    scene_handler_realtime_update: ${MP_SCENE_HANDLER_REALTIME_UPDATE:true}
    scene_process_save_realtime: ${MP_SCENE_PROCESS_SAVE_REALTIME:true}
    element_process_save_realtime: ${MP_ELEMENT_PROCESS_SAVE_REALTIME:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings, caches, env, scheduledtasks
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false


---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs



---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: /home/mp/logs
