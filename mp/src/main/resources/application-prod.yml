ip:
  mariadb: ${MP_DB_IP:10.100.0.101}         # MP新中台mariadb数据库地址
  fdfs: ${FDFS_IP:10.100.1.26}           # FastDFS地址
  cp: ${CP_IP:10.100.7.1}                # 云平台适配层接口地址
  moloch: ${MOLOCH_IP:10.100.0.111}        # moloch的IP地址
  wazuh: ${WAZUH_IP:10.100.7.146}          # wazuh的IP地址
  trex: ${TREX_IP:10.100.7.102}            # trex资源服务器地址
  rabbitmq: ${RABBITMQ_IP:10.100.0.101}           # rabbitmq地址
  log-es: ${LOG_ES_IP:10.100.0.103}        # 日志es
server:
  servlet:
    context-path: /api/mp
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${ip.mariadb}:${MP_DB_PORT:3306}/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: ${MP_DB_USERNAME:root}
    password: ${MP_DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  flyway:
    clean-disabled: true
    enabled: ${MP_FLYWAY_ENABLED_VALUE:false}
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  rabbitmq:
    host: ${ip.rabbitmq}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  web:
    resources:
      static-locations: file:/root/.mp/resources/default_img


logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs
  logback:
    rollingpolicy:
      max-history: 7

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 请求云平台组信息的url配置，必需填写
mp:
  base:
    # fastdfs配置
    fastdfs:
      max-storage-connection: 8   # 最大连接数
      connect-timeout-in-seconds: 10
      network-timeout-in-seconds: 30
      charset: UTF-8
      http-tracker-http-port: ${FDFS_HTTP_TRACKER_HTTP_PORT:80}
      groups:
        # 集群配置：每增加一个集群，参考下例添加相应配置即可，同时在FdfsGroupEnum.java枚举类中添加该集群名称
        - group-name: ${FDFS_GROUP_NAME:DEFAULT}    # 集群名称
          tracker-servers: ${ip.fdfs}:${FDFS_TRACKER_SERVERS_PORT:22122}
          file-server-addr: ${FDFS_FILE-SERVER-ADDR:/fdfs}    # 外部文件服务器地址
          inner-file-server-addr: http://${ip.fdfs}:${FDFS_INNER_FILE_SERVER_PORT:8888}   # 内部文件服务器地址
    fdfs-tracker-servers:
      - ${ip.fdfs}:${FDFS_TRACKER_SERVERS_PORT:22122}
    fdfs-inner-http-server: http://${ip.fdfs}:${FDFS_INNER_FILE_SERVER_PORT:8888}
    fdfs-outer-http-server: ${FDFS_FILE-SERVER-ADDR:/fdfs}
    run-init: true
  devops:
    cp-url: http://${ip.cp}:${CP_PORT:11111} #云平台地址
    #    cr-url: http://${ip.cr} #
    hostname: controller  #主机名称
  situationaware:
    group-url: http://${SITUATION_AWARE_IP:10.100.7.112}:${SITUATION_AWARE_PORT:5079}/v1/scenes
    arkime:
      cpcloud-container-create-url: http://${ip.cp}:11111/v1
      cpcloud-network-mirror-url: http://${ip.cp}:11111/cpcloud/sdn_app/v1
      es-host: ${ip.moloch}
      es-port: ${ARKIME_PORT:9200}
      image-name: centos-arkime_arkime:v2
      username: api
      password: api
    #moloch es节点地址
    es-nodes: ${ip.moloch}:${MOLOCH_PORT:9200}
    wazuh:
      #wazuh 开放接口地址
      base-url: https://${ip.wazuh}:${WAZUH_PORT:55000}
      #wazuh 开放接口用户名密码
      username: ${WAZUH_USERNAME:wazuh-api}
      password: ${WAZUH_PASSWORD:Wazuh123#}
      #wazuh es地址用户名密码
      es-url: ${ip.wazuh}
      es-port: ${WAZUH_ES_PORT:9200}
      es-username: ${WAZUH_ES_USERNAME:admin}
      es-password: ${WAZUH_ES_PASSWORD:admin}
    wazuh-probe-manager:
      url: http://${ip.wazuh}:${WAZUH_PORT:8002}
      agent-script-linux-path: ${WAZUH_AGENT_SCRIPT_LINUX_PATH:/var/ossec/etc/shared/scripts/}
      agent-script-windows-path: ${WAZUH_AGENT_SCRIPT_WINDOWS_PATH:C:\ossec-agent\shared\scripts\}
      task-enable: true
  log:
    es-nodes: ${ip.log-es}:${LOG_ES_PORT:9200}
    exclude-uri: /login
    exclude-method: OPTIONS
  auth:
    activation:
      enable: true
      licenseDir: /home/mp/config/license
  flow:
    # 流量发生器资源地址
    actuator-resource-url: http://${ip.trex}:${TREX_PORT:80}/api/v1/resource
    trex-image: ${TREX_IMAGE:tgn-1205}
  sceneplugincloud:
    cpcloud-server: http://${ip.cp}:${CP_PORT:11111}
  sceneplugincollection:
    wazuh-server-host: ${ip.wazuh}

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false


---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs



---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: /home/mp/logs
