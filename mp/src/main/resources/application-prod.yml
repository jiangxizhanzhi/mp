server:
  servlet:
    context-path: /api/mp
  port: 8080
  tomcat:
    threads:
      min-spare: ${MP_TOMCAT_MIN_POOL_SIZE:10}
      max: ${MP_TOMCAT_MAX_POOL_SIZE:200}

spring:
  datasource:
    ext-var:
      db-ip: ${MP_DB_IP:10.100.0.101}
      db-port: ${MP_DB_PORT:3306}
      db-database: ${MP_DB_DATABASE:mp}
      username: ${MP_DB_USERNAME:root}
      password: ${MP_DB_PASSWORD:root}
    url: jdbc:mysql://${spring.datasource.ext-var.db-ip}:${spring.datasource.ext-var.db-port}/${spring.datasource.ext-var.db-database}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: ${spring.datasource.ext-var.username}
    password: ${spring.datasource.ext-var.password}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${MP_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${MP_DB_MIN_POOL_SIZE:10}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    ext-var:
      enabled: ${MP_FLYWAY_ENABLED_VALUE:false}
    clean-disabled: true
    enabled: ${spring.flyway.ext-var.enabled}
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  rabbitmq:
    ext-var:
      host: ${RABBITMQ_IP:10.100.0.101}
      port: ${RABBITMQ_PORT:5673}
      username: ${RABBITMQ_USERNAME:guest}
      password: ${RABBITMQ_PASSWORD:guest}
    host: ${spring.rabbitmq.ext-var.host}
    port: ${spring.rabbitmq.ext-var.port}
    username: ${spring.rabbitmq.ext-var.username}
    password: ${spring.rabbitmq.ext-var.password}
  web:
    resources:
      static-locations: file:/root/.mp/resources/default_img

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    ext-var:
      max-row-length: ${MP_LOGFILE_MAX_ROW_LENGTH:2000}
    path: /home/mp/logs
    max-file-size: ${MP_LOGFILE_MAX_FILE_SIZE:300MB}
    max-total-size: ${MP_LOGFILE_MAX_TOTAL_SIZE:650MB}
    max-row-length: ${logging.file.ext-var.max-row-length}
  logback:
    rollingpolicy:
      max-history: ${MP_LOGFILE_MAX_HISTORY:15}

springfox:
  documentation:
    ext-var:
      enabled: ${SWAGGER_DOC_ENABLED:false}
      auto-startup: ${SWAGGER_DOC_STARTUP:false}
      swagger-ui:
        enabled: ${SWAGGER_DOC_UI:false}
    enabled: ${springfox.documentation.ext-var.enabled}
    auto-startup: ${springfox.documentation.ext-var.auto-startup}
    swagger-ui:
      enabled: ${springfox.documentation.ext-var.swagger-ui.enabled}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    git:
      mode: simple
  health:
    elasticsearch:
      enabled: false

# 中台各模块相关配置
mp:
  common: #公用配置
    ext-var:
      mp-ip: ${MP_API_IP:10.100.1.12}          # MP中台地址
      mp-port: ${MP_API_PORT:8001}
      cp-ip: ${CP_IP:10.100.7.1}                # 云平台适配层接口地址
      cp-port: ${CP_PORT:11111}
  base:
    ext-var:
      fdfs-ip: ${FDFS_IP:10.100.1.26}
      fdfs-tracker-port: ${FDFS_TRACKER_SERVERS_PORT:22122}
      fdfs-inner-file-port: ${FDFS_INNER_FILE_SERVER_PORT:8888}
      fdfs-outer-http-server: ${FDFS_FILE_SERVER_ADDR:/fdfs}
      file-server: ${FILE_SERVER:fdfs}
      lfs-inner-http-url: ${LFS_INNER_HTTP_URL:http://10.100.7.1:8001/api/mp/file/%s}
      lfs-outer-http-url: ${LFS_OUTER_HTTP_URL:http://10.100.7.1:8001/api/mp/file/%s}
    fdfs-tracker-servers:
      - ${mp.base.ext-var.fdfs-ip}:${mp.base.ext-var.fdfs-tracker-port}
    fdfs-inner-http-server: http://${mp.base.ext-var.fdfs-ip}:${mp.base.ext-var.fdfs-inner-file-port}
    fdfs-outer-http-server: ${mp.base.ext-var.fdfs-outer-http-server}
    file-server: ${mp.base.ext-var.file-server}
    lfs-inner-http-url-template: ${mp.base.ext-var.lfs-inner-http-url}
    lfs-outer-http-url-template: ${mp.base.ext-var.lfs-outer-http-url}
    run-init: true
  # mp-devops-cluster模块
  devopscluster:
    cp-url: http://${mp.common.ext-var.cp-ip}:${mp.common.ext-var.cp-port} #云平台地址
    public-net-proxy: ${MP_PUBLIC_NET_PROXY:false} #公网开关
    public-net-proxy-ip: ${MP_PUBLIC_NET_PROXY_IP:} #公网ip
    public-net-proxy-port: ${PUBLIC_NET_PROXY_PORT:} #公网端口
    public-net-proxy-server: ${MP_PUBLIC_NET_PROXY_SERVER:false}
    public-net-proxy-exclude-protocols: ${MP_PUBLIC_NET_PROXY_EXCLUDE_PROTOCOLS:console,vnc,ssh,telnet,rdp}
    hostname: controller  #主机名称
    max-target-size: 100  # 承诺最大支持靶标的磁盘大小(G)
    disk-alarm-percent: ${MP_DEVOPS_DISK_ALARM_PERCENT:80} # 磁盘空间告警阈值
    cp-ip: ${mp.common.ext-var.cp-ip}                # 云平台适配层接口地址
    cp-port: ${mp.common.ext-var.cp-port}                # 云平台适配层接口地址
    mp-ip: ${mp.common.ext-var.mp-ip}          # MP中台地址
    mp-port: ${mp.common.ext-var.mp-port}           # MP中台地址
    allow-export: ${MP_ALLOW_EXPORT:false}
  # mp-situationaware 模块配置
  situationaware:
    ext-var:
      wazuh-ip: ${WAZUH_IP:10.100.7.1}
      wazuh-port: ${WAZUH_PORT:15500}
      wazuh-username: ${WAZUH_USERNAME:wazuh}
      wazuh-password: ${WAZUH_PASSWORD:Abcd123#}
      wazuh-es-ip: ${WAZUH_ES_IP:10.100.0.101}
      wazuh-es-port: ${WAZUH_ES_PORT:9205}
      wazuh-es-max-page-size: ${ES_MAX_PAGESIZE:10000}
      arkime-es-host: ${ARKIME_ES_IP:10.100.0.101}
      arkime-es-port: ${ARKIME_ES_PORT:9205}
      arkime-disk: ${ARKIME_DISK:100}
    # monitor
    monitor-cp-cloud-interval: ${MP_MONITOR_CP_SRV_INTERVAL:}
    monitor-business-interval: ${MP_MONITOR_BIZ_SRV_INTERVAL:}
    monitor-cp-cloud-server-list: ${MP_MONITOR_CP_SERVER_LIST:}
    monitor-business-server-list: ${MP_MONITOR_BIZ_SERVER_LIST:}
    monitor-cp-cloud-restart-restrict: ${MP_MONITOR_CP_SRV_RESTART_RESTRICT_LIST:}
    monitor-business-restart-restrict: ${MP_MONITOR_BIZ_SRV_RESTART_RESTRICT_LIST:}
    # arkime
    arkime-cpcloud-container-create-url: http://${mp.common.ext-var.cp-ip}:11111/v1
    arkime-cpcloud-network-mirror-url: http://${mp.common.ext-var.cp-ip}:11111/cpcloud/sdn_app/v1
    arkime-es-host: ${mp.situationaware.ext-var.arkime-es-host}
    arkime-es-port: ${mp.situationaware.ext-var.arkime-es-port}
    arkime-image-name: centos-arkime_arkime:v2
    arkime-disk: ${mp.situationaware.ext-var.arkime-disk}
    arkime-username: api
    arkime-password: api
    #wazuh 开放接口地址用户名密码
    wazuh-base-url: http://${mp.situationaware.ext-var.wazuh-ip}:${mp.situationaware.ext-var.wazuh-port}
    wazuh-username: ${mp.situationaware.ext-var.wazuh-username}
    wazuh-password: ${mp.situationaware.ext-var.wazuh-password}
    wazuh-flow-table-url: http://${mp.common.ext-var.cp-ip}:9999/knapsack/probe/v1
    # wazuh-probe-manager
    probe-mgr-url: http://10.100.0.111:8002
    probe-mgr-agent-script-linux-path: /var/ossec/etc/shared/scripts/
    probe-mgr-agent-script-windows-path: C:\ossec-agent\shared\scripts\
    probe-mgr-task-enable: false
    # wazuh es节点地址
    wazuh-es-nodes: ${mp.situationaware.ext-var.wazuh-es-ip}:${mp.situationaware.ext-var.wazuh-es-port}
    wazuh-es-max-page-size: ${mp.situationaware.ext-var.wazuh-es-max-page-size}
    # arkime es 地址
    arkime-es-nodes: ${mp.situationaware.ext-var.arkime-es-host}:${mp.situationaware.ext-var.arkime-es-port}
    # es 日期格式
    es-date-pattern: ${ES_DATE_PATTERN:yyyy-MM-dd'T'HH:mm:ss.SSSZ}
  # mp-log 模块
  log:
    ext-var:
      es-ip: ${LOG_ES_IP:10.100.0.101}
      es-port: ${LOG_ES_PORT:9205}
      es-max-page-size: ${mp.situationaware.ext-var.wazuh-es-max-page-size}
      log-db: ${MP_DEVOPS_LOG_DB:es} #日志存储数据库可以配置：es、sql
      dynamic-level-keeping: ${DYNAMIC_LEVEL_KEEPING:true} #动态日志级别保持
    exclude-urls: ${DEVOPS_LOG_EXCLUDE_URLS:/login}
    exclude-methods: ${DEVOPS_LOG_EXCLUDE_METHODS:OPTIONS}
    es-nodes: ${mp.log.ext-var.es-ip}:${mp.log.ext-var.es-port}
    cp-url: http://${mp.common.ext-var.cp-ip}:11111 #云平台地址
    mp-ip: ${mp.common.ext-var.mp-ip}    # MP中台API地址
    log-db: ${mp.log.ext-var.log-db} #日志存储数据库可以配置：es、sql
    es-max-page-size: ${mp.log.ext-var.es-max-page-size}
    dynamic-level-keeping: ${mp.log.ext-var.dynamic-level-keeping} #动态日志级别保持
  # mp-auth 模块配置
  auth:
    ext-var:
      authenticate-jwt-secret: ${MP_AUTH_JWT_SECRET:38effa66e5454c5d9dd79711fc6ffc4d}
      authenticate-encoder-iterations: ${MP_AUTH_ENCODER_ITERATIONS:10000}
    max-import-user-size: ${MP_MAX_IMPORT_USER_SIZE:1000}
    logout-reset-secret: ${MP_AUTH_LOGOUT_RESET_SECRET:true}
    logout-keep-secret-user: ${MP_AUTH_LOGOUT_KEEP_SECRET_USER:3cf215471268482c88a9986283e38c27}
    default-user-avatar: ${MP_AUTH_DEFAULT_USER_AVATAR:/api/mp/avatar/1.png}
    mq-msg-timeout: ${MP_AUTH_MQ_MSG_TIMEOUT:3600000}
    # authenticate
    authenticate-cache-time: ${MP_AUTH_CACHE_TIME:30}
    authenticate-use-individual-token-secret: ${MP_AUTH_USE_INDIVIDUAL_TOKEN_SECRET:true}
    authenticate-jwt-secret: ${mp.auth.ext-var.authenticate-jwt-secret}
    authenticate-jwt-expires: ${MP_AUTH_JWT_EXPIRES:604800}
    authenticate-urls: ${MP_AUTH_URLS:/auth/**,/sys/**,/flow/**,/cscene/**,/devops/**,/agg/**,/common/**,/collection/**,/probes/**,/wazuh/**,/sessions/**,/flow_group/**}
    authenticate-exclude-urls: ${MP_AUTH_EXCLUDE_URLS:/unauth/**,/sys/activation,/sys/activation/license_status,/sys/activation/machinecode,/sys/config/public,/config/single_ip,/file/**}
    authenticate-encoder-iterations: ${mp.auth.ext-var.authenticate-encoder-iterations}
    authenticate-encoder-hash-width: ${MP_AUTH_ENCODER_HASHWIDTH:256}
  # mp-front-admin 模块
  frontadmin:
    activ-enable: true
    license-dir: /home/mp/config/license
  # mp-front-business 模块
  frontbusiness:
    url-ac-filter-enabled: ${MP_FRONTBUSINESS_URLACFILTER_ENABLED:true}
    url-ac-filter-method-match: true
    url-ac-filter-authority-match: true
    url-ac-filter-ignore-if-not-defined: false
    url-ac-filter-exclude-urls: ${MP_FRONTBUSINESS_URLACFILTER_EXCLUDE_URLS:/api/mp/actuator/info,/api/mp/actuator/health,/api/mp/config/single_ip,/api/mp/file/**}
  # mp-flow 模块配置
  flow:
    trex-image: ${TREX_IMAGE:tgn-trex}
    cp-url: http://${mp.common.ext-var.cp-ip}:${mp.common.ext-var.cp-port} #云平台地址
  sceneplugincloud:
    cpcloud-server: http://${mp.common.ext-var.cp-ip}:${mp.common.ext-var.cp-port}
    delete-retry-times: ${MP_DELETE_RETRY_TIMES:2}
    default-core-router-name: ${MP_DEFAULT_CORE_ROUTER_NAME:Router}
    enable-reallocate-ip-ports: ${MP_ENABLE_REALLOCATE_IP_PORTS:false}
    link-status-enabled: ${MP_LINK_STATUS_ENABLED:true}
    link-status-refresh-period: ${MP_LINK_STATUS_REFRESH_PERIOD:5}
    link-status-cache-seconds: ${MP_LINK_STATUS_CACHE_SECONDS:600}
    link-status-pool-size: ${MP_LINK_STATUS_POOL_SIZE:10}
    link-status-hold-size: ${MP_LINK_STATUS_HOLD_SIZE:200}
    public-net-proxy-server: ${MP_PUBLIC_NET_PROXY_SERVER:false}
    public-net-proxy: ${MP_PUBLIC_NET_PROXY:false}
    public-net-proxy-ip: ${MP_PUBLIC_NET_PROXY_IP:}
    public-net-proxy-port: ${PUBLIC_NET_PROXY_PORT:}
    gateway-types: ${GATEWAY_TYPES:2,3}
    cpcloud-server-timeout: ${MP_CPLOUD_SERVER_TIMEOUT:600000}
    cpcloud-http-pool-size: ${MP_CPLOUD_HTTP_POOL_SIZE:200}
    initiate-pool-size: ${MP_INITIATE_POOL_SIZE:10}
    initiate-hold-size: ${MP_INITIATE_HOLD_SIZE:20000}
    create-pool-size: ${MP_CREATE_POOL_SIZE:10}
    create-hold-size: ${MP_CREATE_HOLD_SIZE:20000}
    cloud-heavy-concurrent-delay-enable: ${MP_CLOUD_HEAVY_CONCURRENT_DELAY_ENABLE:true}
    cloud-heavy-concurrent-delay: ${MP_CLOUD_HEAVY_CONCURRENT_DELAY:10}
    scene-create-install-unzip-apk: ${MP_SCENE_CREATE_INSTALL_UNZIP_APK:true}
    dhcp-ip-allocate: ${MP_DHCP_IP_ALLOCATE:true}
  sceneplugincollection:
    wazuh-server-host: ${mp.situationaware.ext-var.wazuh-ip}
    wazuh-api-server: http://${mp.situationaware.ext-var.wazuh-ip}:15500
    wazuh-api-pass: Abcd123#
    wazuh-es-server: http://${mp.situationaware.ext-var.wazuh-es-ip}:9205
    wazuh-godfs-server: http://${mp.situationaware.ext-var.wazuh-ip}:11888
    wazuh-godfs-outer-http-server: /mp_scene_collection_godfs
    wazuh-run-command-http-callback-url: http://${MP_SELF_IP:mp}:${MP_SELF_PORT:8001}/api/mp/scene_plugin_collection/wazuh_run_command_result
  sceneplugingns3:
    ext-var:
      gns3-ip: ${GNS3_IP:10.100.7.1}
      gns3-port: ${GNS3_PORT:13080}
    gns3-server: http://${mp.sceneplugingns3.ext-var.gns3-ip}:${mp.sceneplugingns3.ext-var.gns3-port}
    gns3-image-uuids: ${MP_GNS3_IMAGE_UUIDS:854f7c24-060f-4dbd-b771-68eab207a071}
  cscene:
    has-own-recording-set: ${HAS_OWN_RECORDING_SET:213,214,236}
    scene-error-creating-seconds: ${MP_SCENE_ERROR_CREATING_SECONDS:3600}
    element-error-creating-seconds: ${MP_ELEMENT_ERROR_CREATING_SECONDS:300}
    ignore-scene-creating-seconds: ${MP_IGNORE_SCENE_CREATING_SECONDS:120}
    enable-scene-cron-job: ${MP_ENABLE_SCENE_CRON_JOB:true}
    enable-command-change: ${MP_ENABLE_COMMAND_CHANGE:false}
    cron-job-expression: ${MP_CRON_JOB_EXPRESSION:0 0/15 * * * ?}
    enable-node-limit-db-check: ${MP_ENABLE_NODE_LIMIT_DB_CHECK:true}
    cp-ip: ${mp.common.ext-var.cp-ip}
    cp-port: ${mp.common.ext-var.cp-port}
  scene:
    scene-pool-size: ${MP_SCENE_POOL_SIZE:100}
    scene-hold-size: ${MP_SCENE_HOLD_SIZE:10000}
    element-pool-size: ${MP_ELEMENT_POOL_SIZE:100}
    element-hold-size: ${MP_ELEMENT_HOLD_SIZE:10000}
    scene-handler-realtime-update: ${MP_SCENE_HANDLER_REALTIME_UPDATE:true}
    scene-process-save-realtime: ${MP_SCENE_PROCESS_SAVE_REALTIME:true}
    element-process-save-realtime: ${MP_ELEMENT_PROCESS_SAVE_REALTIME:true}
  aggregation:
    export-image-timeout: ${MP_EXPORT_IMAGE_TIMEOUT:1200000}

# for kaptcha
kaptcha:
  border:
    enabled: true
    color: '200,200,200'
    thickness: 1
  image:
    width: 200
    height: 60
  text-producer:
    ext-var:
      character:
        string: ${MP_AUTH_TEXT_SECRET:'123456789abcdefghijklmnpqrstuvwxyzABCDEFGHIJKLMNPQRSTUVWXYZ'}
    impl:
    character:
      string: ${kaptcha.text-producer.ext-var.character.string}
      length: 4
      space: 10
