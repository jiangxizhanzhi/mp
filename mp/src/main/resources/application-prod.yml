ip:
  self: ${MP_SELF_IP:mp}                    # mp自身地址
  mariadb: ${MP_DB_IP:10.100.0.101}         # MP新中台mariadb数据库地址
  fdfs: ${FDFS_IP:10.100.1.26}           # FastDFS地址
  cp: ${CP_IP:10.100.7.1}                # 云平台适配层接口地址
  moloch: ${MOLOCH_IP:10.100.0.101}        # moloch的IP地址
  wazuh: ${WAZUH_IP:10.100.7.1}          # wazuh的IP地址
  rabbitmq: ${RABBITMQ_IP:10.100.0.101}           # rabbitmq地址
  log-es: ${LOG_ES_IP:10.100.0.101}        # 日志es
  mp: ${MP_API_IP_PORT:10.100.1.12:8001}                       # MP中台API地址
port:
  self-callback: ${MP_SELF_PORT:8080}
server:
  servlet:
    context-path: /api/mp
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${ip.mariadb}:${MP_DB_PORT:3306}/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: ${MP_DB_USERNAME:root}
    password: ${MP_DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    clean-disabled: true
    enabled: ${MP_FLYWAY_ENABLED_VALUE:false}
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  rabbitmq:
    host: ${ip.rabbitmq}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  web:
    resources:
      static-locations: file:/root/.mp/resources/default_img


logging:
  config: classpath:logback-spring-prod.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs
    max-total-size: ${MP_LOGFILE_MAX_TOTAL_SIZE:1GB}
    max-row-length: ${LOG_FILE_MAX_ROW_LENGTH:2000}
  logback:
    rollingpolicy:
      max-history: ${MP_LOGFILE_MAX_HISTORY:15}
springfox:
  documentation:
    enabled: ${SWAGGER_DOC_ENABLED:false}
    auto-startup: ${SWAGGER_DOC_STARTUP:false}
    swagger-ui:
      enabled: ${SWAGGER_DOC_UI:false}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 请求云平台组信息的url配置，必需填写
mp:
  base:
    # fastdfs配置
    fastdfs:
      max-storage-connection: 8   # 最大连接数
      connect-timeout-in-seconds: 10
      network-timeout-in-seconds: 30
      charset: UTF-8
      http-tracker-http-port: ${FDFS_HTTP_TRACKER_HTTP_PORT:80}
      groups:
        # 集群配置：每增加一个集群，参考下例添加相应配置即可，同时在FdfsGroupEnum.java枚举类中添加该集群名称
        - group-name: ${FDFS_GROUP_NAME:DEFAULT}    # 集群名称
          tracker-servers: ${ip.fdfs}:${FDFS_TRACKER_SERVERS_PORT:22122}
          file-server-addr: ${FDFS_FILE-SERVER-ADDR:/fdfs}    # 外部文件服务器地址
          inner-file-server-addr: http://${ip.fdfs}:${FDFS_INNER_FILE_SERVER_PORT:8888}   # 内部文件服务器地址
    fdfs-tracker-servers:
      - ${ip.fdfs}:${FDFS_TRACKER_SERVERS_PORT:22122}
    fdfs-inner-http-server: http://${ip.fdfs}:${FDFS_INNER_FILE_SERVER_PORT:8888}
    fdfs-outer-http-server: ${FDFS_FILE-SERVER-ADDR:/fdfs}
    run-init: true
  devops:
    cp-url: http://${ip.cp}:${CP_PORT:11111} #云平台地址
    public-net-proxy: ${MP_PUBLIC_NET_PROXY:false} #公网开关
    public-net-proxy-ip: ${MP_PUBLIC_NET_PROXY_IP:} #公网ip
    public-net-proxy-port: ${PUBLIC_NET_PROXY_PORT:} #公网端口
    #    cr-url: http://${ip.cr} #
    hostname: controller  #主机名称
    max-target-size: 100  # 承诺最大支持靶标的磁盘大小(G)
    disk-alarm-percent: 80 # 磁盘空间告警阈值
    monitor:
      cp_srv_monitors:
        - probe-name: monitor_cp_service.py
          launch-id: 093f61683e1a4e3fbe80664e791ea001
          interval: 180s
          service-list: chronyd,dnsmasq,etcd,httpd,libvirtd,mariadb.service,memcached,nfs-server,nginx,openvswitch,kuryr-libnetwork,network,rabbitmq-server,rpcbind,supervisord,vsftpd,openstack-nova-api,openstack-nova-scheduler,openstack-nova-conductor,openstack-nova-novncproxy,openstack-nova-serialproxy,openstack-nova-compute,neutron-server,neutron-openvswitch-agent,neutron-dhcp-agent,neutron-metadata-agent,neutron-l3-agent,openstack-glance-api,openstack-cinder-api,openstack-cinder-volume
        - probe-name: monitor_cp_service.py
          launch-id: 093f6512519d49b2986819e29e4ba002
          interval: 180s
          service-list: docker,containerd,zun-api,zun-cni-daemon,zun-compute,zun-wsproxy,openstack-cinder-scheduler,cpcloud:celery,cpcloud:info,cpcloud:instance_control,cpcloud:logger_app,cpcloud:npc_node,cpcloud:probe,cpcloud:scheduler,cpcloud:sdn_app,cpcloud:sdn_base_vr,cpcloud:vpn,cpcloud:web,adaptation,cpcloud_guacamole,cpcloud_guacd,cpcloud_web-tty-client,fastdfs,mariadb,rabbitmq,redis,zabbix-server-mysql,zabbix-web-nginx-mysql
      biz_srv_monitors:
        - probe-name: monitor_biz_service.py
          launch-id: 093fc7abba264d38a022a4c143d6a003
          interval: 180s
          service-list: mp,mp_es,wazuh-kibana,wazuh-manager,ad,bc,drm,PY-HOST
  situationaware:
    arkime:
      cpcloud-container-create-url: http://${ip.cp}:11111/v1
      cpcloud-network-mirror-url: http://${ip.cp}:11111/cpcloud/sdn_app/v1
      es-host: ${ip.moloch}
      es-port: ${ARKIME_PORT:9205}
      image-name: centos-arkime_arkime:v2
      username: api
      password: api
    #moloch es节点地址
    es-nodes: ${ip.moloch}:${MOLOCH_PORT:9205}
    wazuh:
      #wazuh 开放接口地址
      base-url: http://${ip.wazuh}:${WAZUH_PORT:15500}
      #wazuh 开放接口用户名密码
      username: ${WAZUH_USERNAME:wazuh}
      password: ${WAZUH_PASSWORD:Abcd123#}
    wazuh-probe-manager:
      url: http://${ip.wazuh}:${WAZUH_PORT:8002}
      agent-script-linux-path: ${WAZUH_AGENT_SCRIPT_LINUX_PATH:/var/ossec/etc/shared/scripts/}
      agent-script-windows-path: ${WAZUH_AGENT_SCRIPT_WINDOWS_PATH:C:\ossec-agent\shared\scripts\}
      task-enable: true
  collection:
    #自定义探针配置
    default-interval: 180s
    probes:
      - probe-name: get_host_info.py
        id: eda72998ba654c8d8625f61eaa918eb3
        interval: 180s
        outputFormat: plain
      - probe-name: get_net_conns.py
        id: 09ffcc4a67ef4accb407a1555629d0f8
        interval: 180s
        outputFormat: json
      - probe-name: get_env_values.py
        id: 32e9c4db9729440290e843bb6d80295b
        interval: 300s
        outputFormat: json
      - probe-name: get_processes.py
        id: 38949dcf3829489d8dd9e0e63cc66541
        interval: 180s
        outputFormat: json
      - probe-name: get_system_users.py
        id: 4894f48375ee4dd5b7a7bad7c1a78376
        interval: 180s
        outputFormat: json
  log:
    es-nodes: ${ip.log-es}:${LOG_ES_PORT:9205}
    exclude-uri: /login
    exclude-method: OPTIONS
  auth:
    activation:
      enable: true
      licenseDir: /home/mp/config/license
    url-ac-filter:
      enabled: true
      method-match: true
      authority-match: true
      ignore-if-not-defined: false
    biz:
      max-import-user-size: ${MP_MAX_IMPORT_USER_SIZE:100}
      logout-reset-secret: ${MP_AUTH_LOGOUT_RESET_SECRET:true}
    authenticate:
      use-individual-token-secret: ${MP_AUTH_USE_INDIVIDUAL_TOKEN_SECRET:true}
      jwt-secret: ${MP_AUTH_JWT_SECRET:}
      jwt-expires: ${MP_AUTH_JWT_EXPIRES:604800}
      urls: ${MP_AUTH_URLS:/auth/**,/sys/notice/**,/systemOperation/**,/flow/**,/cscene/**,/devops/**}
  flow:
    trex-image: ${TREX_IMAGE:tgn-trex}
  sceneplugincloud:
    cpcloud-server: http://${ip.cp}:${CP_PORT:11111}
    delete_retry_times: ${MP_DELETE_RETRY_TIMES:2}
    default_core_router_name: ${MP_DEFAULT_CORE_ROUTER_NAME:Router}
    enable_reallocate_ip_ports: ${MP_ENABLE_REALLOCATE_IP_PORTS:false}
    link_status_enabled: ${MP_LINK_STATUS_ENABLED:true}
    link_status_refresh_period: ${MP_LINK_STATUS_REFRESH_PERIOD:5}
    link_status_cache_seconds: ${MP_LINK_STATUS_CACHE_SECONDS:600}
    link_status_pool_size: ${MP_LINK_STATUS_POOL_SIZE:10}
    link_status_hold_size: ${MP_LINK_STATUS_HOLD_SIZE:200}
    public-net-proxy-server: ${MP_PUBLIC_NET_PROXY_SERVER:false}
    public-net-proxy: ${MP_PUBLIC_NET_PROXY:false}
    public-net-proxy-ip: ${MP_PUBLIC_NET_PROXY_IP:}
    public-net-proxy-port: ${PUBLIC_NET_PROXY_PORT:}
  sceneplugincollection:
    wazuh-server-host: ${ip.wazuh}
    wazuh-api-server: http://${ip.wazuh}:15500
    wazuh-api-pass: Abcd123#
    wazuh-es-server: http://${ip.es}:9205
    wazuh-godfs-server: http://${ip.wazuh}:11888
    wazuh-godfs-outer-http-server: /mp_scene_collection_godfs
    wazuh-run-command-http-callback-url: http://${ip.self}:${port.self-callback}/api/mp/scene_plugin_collection/wazuh_run_command_result
  cscene:
    has-own-recording-set: ${HAS_OWN_RECORDING_SET:213,214,236}
    scene-error-creating-seconds: ${MP_SCENE_ERROR_CREATING_SECONDS:3600}
    element-error-creating-seconds: ${MP_ELEMENT_ERROR_CREATING_SECONDS:300}
    enable-scene-cron-job: ${MP_ENABLE_SCENE_CRON_JOB:true}
    enable-command-change: ${MP_ENABLE_COMMAND_CHANGE:false}
    cron-job-expression: ${MP_CRON_JOB_EXPRESSION:* 0/15 * * * ?}
    access-mode-ip: ${MP_ACCESS_MODE_IP:}
  scene:
    gateway_types: ${GATEWAY_TYPES:2,3}
    access-mode-ip: ${MP_ACCESS_MODE_IP:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings, caches, env, scheduledtasks
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false


---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs



---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: /home/mp/logs
