#      character:

logging:
  #系统可能在运行时修改全局日志级别，顾单独提取到ext中，
  level:
    ext-var:
      root: ${ROOT_LEVEL:INFO}
  file:
    ext-var:
      max-row-length: ${MP_LOGFILE_MAX_ROW_LENGTH:2000}
      max-file-size: ${MP_LOGFILE_MAX_FILE_SIZE:300MB}
      max-total-size: ${MP_LOGFILE_MAX_TOTAL_SIZE:650MB}
      max-history: ${MP_LOGFILE_MAX_HISTORY:15}