server:
  servlet:
    context-path: /api/mp
  port: 8080
  tomcat:
    threads:
      min-spare: ${server.tomcat.threads.mp_tomcat_min_pool_size}
      max: ${server.tomcat.threads.mp_tomcat_max_pool_size}

spring:
  datasource:
#    ext-var:
#      db-ip: ${MP_DB_IP:10.100.7.1}
#      db-port: ${MP_DB_PORT:9306}
#      db-database: ${MP_DB_DATABASE:mp}
#      username: ${MP_DB_USERNAME:root}
#      password: ${MP_DB_PASSWORD:cyberpeace@2020}
    url: jdbc:mysql://${spring.datasource.ext-var.db-ip}:${spring.datasource.ext-var.db-port}/${spring.datasource.ext-var.db-database}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: ${spring.datasource.ext-var.username}
    password: ${spring.datasource.ext-var.password}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${spring.datasource.hikari.mp_db_max_pool_size}
      minimum-idle: ${spring.datasource.hikari.mp_db_min_pool_size}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
#    ext-var:
#      enabled: ${MP_FLYWAY_ENABLED_VALUE:false}
    clean-disabled: true
    enabled: ${spring.flyway.ext-var.enabled}
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 10000MB
  rabbitmq:
#    ext-var:
#      host: ${RABBITMQ_IP:10.100.7.1}
#      port: ${RABBITMQ_PORT:9672}
#      username: ${RABBITMQ_USERNAME:cpcloud}
#      password: ${RABBITMQ_PASSWORD:MzhhMzU4NDQzNzU}
    host: ${spring.rabbitmq.ext-var.host}
    port: ${spring.rabbitmq.ext-var.port}
    username: ${spring.rabbitmq.ext-var.username}
    password: ${spring.rabbitmq.ext-var.password}
  web:
    resources:
      static-locations: file:/root/.mp/resources/default_img

logging:
  config: classpath:logback-spring.xml
  level:
    ext-var:
      root: ${ROOT_LEVEL:INFO}
    root: ${logging.level.ext-var.root}
  file:
#    ext-var:
#      max-row-length: ${MP_LOGFILE_MAX_ROW_LENGTH:2000}
    max-file-size: ${logging.file.mp_logfile_max_file_size}
    max-total-size: ${logging.file.mp_logfile_max_total_size}
    max-row-length: ${logging.file.ext-var.max-row-length}
  logback:
    rollingpolicy:
      max-history: ${logging.logback.rollingpolicy.mp_logfile_max_history}

springfox:
  documentation:
#    ext-var:
#      enabled: ${SWAGGER_DOC_ENABLED:true}
#      auto-startup: ${SWAGGER_DOC_STARTUP:true}
#      swagger-ui:
#        enabled: ${SWAGGER_DOC_UI:true}
    enabled: ${springfox.documentation.ext-var.enabled}
    auto-startup: ${springfox.documentation.ext-var.auto-startup}
    swagger-ui:
      enabled: ${springfox.documentation.ext-var.swagger-ui.enabled}

management:
#  endpoints:
#    web:
#      exposure:
#        include: health, info
  info:
    git:
      mode: simple
  health:
    elasticsearch:
      enabled: false

# 中台各模块相关配置
mp:
  common: #公用配置
#    ext-var:
#      mp-ip: ${MP_API_IP:10.100.1.12}          # MP中台地址
#      mp-port: ${MP_API_PORT:8001}
#      cp-ip: ${CP_IP:10.100.7.1}                # 云平台适配层接口地址
#      cp-port: ${CP_PORT:11111}
  base:
#    ext-var:
#      fdfs-ip: ${FDFS_IP:10.100.7.1}
#      fdfs-tracker-port: ${FDFS_TRACKER_SERVERS_PORT:22122}
#      fdfs-inner-file-port: ${FDFS_INNER_FILE_SERVER_PORT:8888}
#      fdfs-outer-http-server: ${FDFS_FILE_SERVER_ADDR:/fdfs}
#      file-server: ${FILE_SERVER:lfs}
#      lfs-inner-http-url: ${LFS_INNER_HTTP_URL:http://10.100.7.1:8001/api/mp/file/%s}
#      lfs-outer-http-url: ${LFS_OUTER_HTTP_URL:http://10.100.7.1:8001/api/mp/file/%s}
    fdfs-tracker-servers:
      - ${mp.base.ext-var.fdfs-ip}:${mp.base.ext-var.fdfs-tracker-port}
    fdfs-inner-http-server: http://${mp.base.ext-var.fdfs-ip}:${mp.base.ext-var.fdfs-inner-file-port}
    fdfs-outer-http-server: ${mp.base.ext-var.fdfs-outer-http-server}
    file-server: ${mp.base.ext-var.file-server}
    lfs-inner-http-url-template: ${mp.base.ext-var.lfs-inner-http-url}
    lfs-outer-http-url-template: ${mp.base.ext-var.lfs-outer-http-url}
#    run-init: true
  # mp-devops-cluster模块
  devopscluster:
    cp-url: http://${mp.common.ext-var.cp-ip}:${mp.common.ext-var.cp-port} #云平台地址
    public-net-proxy: ${mp.devopscluster.mp_public_net_proxy} #公网开关
    public-net-proxy-ip: ${mp.devopscluster.mp_public_net_proxy_ip} #公网ip
    public-net-proxy-port: ${mp.devopscluster.public_net_proxy_port} #公网端口
    public-net-proxy-server: ${mp.devopscluster.mp_public_net_proxy_server}
    public-net-proxy-exclude-protocols: ${mp.devopscluster.mp_public_net_proxy_exclude_protocols}
    hostname: controller  #主机名称
    max-target-size: 100  # 承诺最大支持靶标的磁盘大小(G)
    disk-alarm-percent: ${mp.devopscluster.mp_devops_disk_alarm_percent} # 磁盘空间告警阈值
    cp-ip: ${mp.common.ext-var.cp-ip}                # 云平台适配层接口地址
    cp-port: ${mp.common.ext-var.cp-port}                # 云平台适配层接口地址
    mp-ip: ${mp.common.ext-var.mp-ip}          # MP中台地址
    mp-port: ${mp.common.ext-var.mp-port}           # MP中台地址
    allow-export: ${mp.devopscluster.mp_allow_export}
  # mp-situationaware 模块配置
  situationaware:
#    ext-var:
#      wazuh-ip: ${WAZUH_IP:10.100.7.1}
#      wazuh-port: ${WAZUH_PORT:15500}
#      wazuh-username: ${WAZUH_USERNAME:wazuh}
#      wazuh-password: ${WAZUH_PASSWORD:Abcd123#}
#      wazuh-es-ip: ${WAZUH_ES_IP:10.100.7.1}
#      wazuh-es-port: ${WAZUH_ES_PORT:9205}
#      wazuh-es-max-page-size: ${ES_MAX_PAGESIZE:10000}
#      arkime-es-host: ${ARKIME_ES_IP:10.100.7.1}
#      arkime-es-port: ${ARKIME_ES_PORT:9205}
#      arkime-disk: ${ARKIME_DISK:50}
    # monitor
    monitor-cp-cloud-interval:
    monitor-business-interval:
    monitor-cp-cloud-server-list:
    monitor-business-server-list:
    monitor-cp-cloud-restart-restrict:
    monitor-business-restart-restrict:
    # arkime
    arkime-cpcloud-container-create-url: http://${mp.common.ext-var.cp-ip}:11111/v1
    arkime-cpcloud-network-mirror-url: http://${mp.common.ext-var.cp-ip}:11111/cpcloud/sdn_app/v1
    arkime-es-host: ${mp.situationaware.ext-var.arkime-es-host}
    arkime-es-port: ${mp.situationaware.ext-var.arkime-es-port}
    arkime-image-name: centos-arkime_arkime:v2
    arkime-disk: ${mp.situationaware.ext-var.arkime-disk}
    arkime-username: api
    arkime-password: api
    #wazuh 开放接口地址用户名密码
    wazuh-base-url: http://${mp.situationaware.ext-var.wazuh-ip}:${mp.situationaware.ext-var.wazuh-port}
    wazuh-username: ${mp.situationaware.ext-var.wazuh-username}
    wazuh-password: ${mp.situationaware.ext-var.wazuh-password}
    wazuh-flow-table-url: http://${mp.common.ext-var.cp-ip}:9999/knapsack/probe/v1
    # wazuh-probe-manager
    probe-mgr-url: http://${mp.situationaware.ext-var.probe-ip}:${mp.situationaware.ext-var.probe-port}
    probe-mgr-agent-script-linux-path: ${mp.situationaware.ext-var.wazuh_agent_script_linux_path}
    probe-mgr-agent-script-windows-path: ${mp.situationaware.ext-var.wazuh_agent_script_windows_path}
    probe-mgr-task-enable: true
    # wazuh es节点地址
    wazuh-es-nodes: ${mp.situationaware.ext-var.wazuh-es-ip}:${mp.situationaware.ext-var.wazuh-es-port}
    wazuh-es-max-page-size: ${mp.situationaware.ext-var.wazuh-es-max-page-size}
    # arkime es 地址
    arkime-es-nodes: ${mp.situationaware.ext-var.arkime-es-host}:${mp.situationaware.ext-var.arkime-es-port}
    # es 日期格式
    es-date-pattern: ${mp.base.situationaware.es_date_pattern}
  # mp-log 模块
  log:
    ext-var:
#      es-ip: ${LOG_ES_IP:10.100.7.1}
#      es-port: ${LOG_ES_PORT:9205}
#      es-max-page-size: ${ES_MAX_PAGESIZE:10000}
#      log-db: ${MP_DEVOPS_LOG_DB:sql} #日志存储数据库可以配置：es、sql
#      dynamic-level-keeping: ${DYNAMIC_LEVEL_KEEPING:true} #动态日志级别保持
       dynamic-level-only-root: false;
    exclude-urls: ${mp.log.ext-var.exclude-urls}
    exclude-methods: ${mp.log.ext-var.xclude-methods}
    es-nodes: ${mp.log.ext-var.es-ip}:${mp.log.ext-var.es-port}
    cp-url: http://${mp.common.ext-var.cp-ip}:11111 #云平台地址
    mp-ip: ${mp.common.ext-var.mp-ip}    # MP中台API地址
    log-db: ${mp.log.ext-var.log-db} #日志存储数据库可以配置：es、sql
    es-max-page-size: ${mp.log.ext-var.es-max-page-size}
    dynamic-level-keeping: ${mp.log.ext-var.dynamic-level-keeping} #动态日志级别保持
    dynamic-level-only-root: ${mp.log.ext-var.dynamic-level-only-root};
  # mp-auth 模块配置
  auth:
    ext-var:
#      authenticate-jwt-secret: ${MP_AUTH_JWT_SECRET:a668b6fec22144f38a6f72f8a5aa7326}
#      authenticate-encoder-iterations: ${MP_AUTH_ENCODER_ITERATIONS:10000}
    max-import-user-size: ${mp.auth.ext-var.max-import-user-size}
    logout-reset-secret: ${mp.auth.ext-var.logout-reset-secret}
    logout-keep-secret-user: ${mp.auth.ext-var.logout-keep-secret-user}
    default-user-avatar: ${mp.auth.ext-var.default-user-avatar}
    mq-msg-timeout: ${mp.auth.ext-var.mq-msg-timeout}
    # authenticate
    authenticate-cache-time: ${mp.auth.ext-var.authenticate-cache-time}
    authenticate-use-individual-token-secret: ${mp.auth.ext-var.authenticate-use-individual-token-secret}
    authenticate-jwt-secret: ${mp.auth.ext-var.authenticate-jwt-secret}
    authenticate-jwt-expires: ${mp.auth.ext-var.authenticate-jwt-expires}
    authenticate-urls: ${mp.auth.ext-var.authenticate-urls}
    #authenticate-exclude-urls: /unauth/**,/sys/activation,/sys/activation/license_status,/sys/activation/machinecode,/sys/config/public,/config/single_ip,/file/**
    authenticate-encoder-iterations: ${mp.auth.ext-var.authenticate-encoder-iterations}
    authenticate-encoder-hash-width: ${mp.auth.ext-var.authenticate-encoder-hash-width}
  # mp-front-admin 模块配置
  frontadmin:
    activ-enable: true
    license-dir: /home/mp/config/license
  # mp-front-business 模块配置
  frontbusiness:
    url-ac-filter-enabled: ${mp.frontbusiness.url-ac-filter-enabled}
    url-ac-filter-method-match: true
    url-ac-filter-authority-match: true
    url-ac-filter-ignore-if-not-defined: false
    #url-ac-filter-exclude-urls: /api/mp/actuator/info,/api/mp/actuator/health,/api/mp/config/single_ip,/api/mp/file/**
  # mp-flow 模块配置
  flow:
    trex-image: ${mp.flow.trex-image}
    cp-url: http://${mp.common.ext-var.cp-ip}:${mp.common.ext-var.cp-port} #云平台地址
  sceneplugincloud:
    cpcloud-server: http://${mp.common.ext-var.cp-ip}:${mp.common.ext-var.cp-port}
    delete-retry-times: ${mp.sceneplugincloud.delete-retry-times}
    default-core-router-name: ${mp.sceneplugincloud.default-core-router-name}
    enable-reallocate-ip-ports: ${mp.sceneplugincloud.enable-reallocate-ip-ports}
    link-status-enabled: ${mp.sceneplugincloud.link-status-enabled}
    link-status-refresh-period: ${mp.sceneplugincloud.link-status-refresh-period}
    link-status-cache-seconds: ${mp.sceneplugincloud.link-status-cache-seconds}
    link-status-pool-size: ${mp.sceneplugincloud.link-status-pool-size}
    link-status-hold-size: ${mp.sceneplugincloud.link-status-hold-size}
    public-net-proxy-server: ${mp.sceneplugincloud.public-net-proxy-server}
    public-net-proxy: ${mp.sceneplugincloud.public-net-proxy}
    public-net-proxy-ip: ${mp.sceneplugincloud.public-net-proxy-ip}
    public-net-proxy-port: ${mp.sceneplugincloud.public-net-proxy-port}
    gateway-types: ${mp.sceneplugincloud.gateway-types}
    cpcloud-server-timeout: ${mp.sceneplugincloud.cpcloud-server-timeout}
    cpcloud-http-pool-size: ${mp.sceneplugincloud.cpcloud-http-pool-size}
    initiate-pool-size: ${mp.sceneplugincloud.initiate-pool-size}
    initiate-hold-size: ${mp.sceneplugincloud.initiate-hold-size}
    create-pool-size: ${mp.sceneplugincloud.create-pool-size}
    create-hold-size: ${mp.sceneplugincloud.create-hold-size}
    cloud-heavy-concurrent-delay-enable: ${mp.sceneplugincloud.cloud-heavy-concurrent-delay-enable}
    cloud-heavy-concurrent-delay: ${mp.sceneplugincloud.cloud-heavy-concurrent-delay}
    scene-create-install-unzip-apk: ${mp.sceneplugincloud.scene-create-install-unzip-apk}
    dhcp-ip-allocate: ${mp.sceneplugincloud.dhcp-ip-allocate}
  sceneplugincollection:
    wazuh-server-host: ${mp.situationaware.ext-var.wazuh-ip}
    wazuh-api-server: http://${mp.situationaware.ext-var.wazuh-ip}:15500
    wazuh-api-pass: Abcd123#
    wazuh-es-server: http://${mp.situationaware.ext-var.wazuh-es-ip}:9205
    wazuh-godfs-server: http://${mp.situationaware.ext-var.wazuh-ip}:11888
    wazuh-godfs-outer-http-server: /mp_scene_collection_godfs
    wazuh-run-command-http-callback-url: http://${mp.situationaware.ext-var.mp_self_ip}:${mp.situationaware.ext-var.mp_self_port}/api/mp/scene_plugin_collection/wazuh_run_command_result
  sceneplugingns3:
#    ext-var:
#      gns3-ip: ${GNS3_IP:10.100.7.1}
#      gns3-port: ${GNS3_PORT:8088}
    gns3-server: http://${mp.sceneplugingns3.ext-var.gns3-ip}:${mp.sceneplugingns3.ext-var.gns3-port}
    gns3-image-uuids: ${mp.sceneplugingns3.ext-var.gns3-image-uuids}
  cscene:
    has-own-recording-set: ${mp.common.ext-var.has-own-recording-set}
    scene-error-creating-seconds: ${mp.common.ext-var.scene-error-creating-seconds}
    element-error-creating-seconds: ${mp.common.ext-var.element-error-creating-seconds}
    ignore-scene-creating-seconds: ${mp.common.ext-var.ignore-scene-creating-seconds}
    enable-scene-cron-job: ${mp.common.ext-var.enable-scene-cron-job}
    enable-command-change: ${mp.common.ext-var.enable-command-change}
    cron-job-expression: ${mp.common.ext-var.cron-job-expression}
    enable-node-limit-db-check: ${mp.common.ext-var.enable-node-limit-db-check}
    cp-ip: ${mp.common.ext-var.cp-ip}
    cp-port: ${mp.common.ext-var.cp-port}
  scene:
    scene-pool-size: ${mp.scene.ext-var.scene-pool-size}
    scene-hold-size: ${mp.scene.ext-var.scene-hold-size}
    element-pool-size: ${mp.scene.ext-var.element-pool-size}
    element-hold-size: ${mp.scene.ext-var.element-hold-size}
    scene-handler-realtime-update: ${mp.scene.ext-var.scene-handler-realtime-update}
    scene-process-save-realtime: ${mp.scene.ext-var.scene-process-save-realtime}
    element-process-save-realtime: ${mp.scene.ext-var.element-process-save-realtime}
    dhcp-control: ${mp.scene.ext-var.dhcp-control}
  aggregation:
    export-image-timeout: ${mp.scene.ext-var.export-image-timeout}

# for kaptcha
kaptcha:
  border:
    enabled: true
    color: '200,200,200'
    thickness: 1
  image:
    width: 200
    height: 60
  text-producer:
    ext-var:
      character:
        string: ${MP_AUTH_TEXT_SECRET:'0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'}
    impl:
    character:
      string: ${kaptcha.text-producer.ext-var.character.string}
      length: 4
      space: 10