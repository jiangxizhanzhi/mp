ip:
  self: mp                     # mp自身地址
  mariadb: 10.100.1.12        # MP新中台mariadb数据库地址
  fdfs: 10.100.1.26             # FastDFS地址
  cp: 10.100.7.1                # 云平台适配层接口地址
  moloch: 10.100.0.101          # moloch的IP地址
  wazuh: 10.100.7.1           # wazuh的IP地址
  es: 10.100.0.101                 # MP新中台ES地址
  rabbitmq: 10.100.0.101        # rabbitmq地址
  mp: 10.100.1.12:8001                       # MP中台地址
port:
  self-callback: 8080
server:
  servlet:
    context-path: /api/mp
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${ip.mariadb}:9306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: mp
    password: bymsoSAGToyAcs9H
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    clean-disabled: true
    enabled: false
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  rabbitmq:
    host: ${ip.rabbitmq}
    port: 5673
    username: guest
    password: guest
  web:
    resources:
      static-locations: file:${user.home}/img


logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs
    max-file-size: 300MB
    max-total-size: 650MB
    max-row-length: 2000
  logback:
    rollingpolicy:
      max-history: 15
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
springfox:
  documentation:
    enabled: ${SWAGGER_DOC_ENABLED:true}
    auto-startup: ${SWAGGER_DOC_STARTUP:true}
    swagger-ui:
      enabled: ${SWAGGER_DOC_UI:true}

# 请求云平台组信息的url配置，必需填写
mp:
  base:
    fdfs-tracker-servers:
        - ${ip.fdfs}:22122
    fdfs-inner-http-server: http://${ip.fdfs}:8888
    fdfs-outer-http-server: /fdfs
  devops:
#    cp-url: http://10.100.7.1:111 #云平台地址
    cp-url: http://${ip.cp}:11111 #云平台地址
    public-net-proxy: false #公网开关
    public-net-proxy-ip: ${ip.cp} #公网ip
    public-net-proxy-port: 11111 #公网端口
    hostname: controller  #主机名称
    max-target-size: 100  # 承诺最大支持靶标的磁盘大小(G)
    disk-alarm-percent: 80 # 磁盘空间告警阈值
    monitor:
      cp-interval:
      biz-interval:
      cp-server-list-1:
      cp-server-list-2:
      biz-server-list:
      cp-restart-restrict-1:
      cp-restart-restrict-2:
      biz-restart-restrict:
  situationaware:
    arkime:
      cpcloud-container-create-url: http://${ip.cp}:11111/v1
      cpcloud-network-mirror-url: http://${ip.cp}:11111/cpcloud/sdn_app/v1
      es-host: ${ip.moloch}
      es-port: ${ARKIME_PORT:9205}
      image-name: centos-arkime_arkime:v2
      username: api
      password: api
    #moloch es节点地址
    es-nodes: ${ip.moloch}:9205
    wazuh:
      #wazuh 开放接口地址
      base-url: http://${ip.wazuh}:15500
      #wazuh 开放接口用户名密码
      username: wazuh
      password: Abcd123#
      flow-table-url: http://${ip.cp}:9999/knapsack/probe/v1
    wazuh-probe-manager:
      url: http://10.100.0.111:8002
      agent-script-linux-path: /var/ossec/etc/shared/scripts/
      agent-script-windows-path: C:\ossec-agent\shared\scripts\
      task-enable: false
  cscene:
    has-own-recording-set: ${HAS_OWN_RECORDING_SET:213,214,236}

  log:
    es-nodes: ${ip.es}:9205
    exclude-uri: /login
    exclude-method: OPTIONS
  auth:
    activation:
      enable: true
      licenseDir: /home/mp/config/license
    url-ac-filter:
      enabled: true
      method-match: true
      authority-match: true
      ignore-if-not-defined: false
    biz:
      max-import-size: 100
      logout-reset-secret: true
      default-user-avatar: /api/mp/avatar/1.png
    authenticate:
      cache-time: 30
      use-individual-token-secret: true
      jwt-secret: 38effa66e5454c5d9dd79711fc6ffc4d
      jwt-expires: 604800
      urls: /auth/**,/sys/notice/**,/systemOperation/**,/flow/**,/cscene/**,/devops/**
      encoder:
        iterations:
        hash-width:
  flow:
    trex-image: tgn-trex
  sceneplugincloud:
    cpcloud-server: http://${ip.cp}:11111
  sceneplugincollection:
    wazuh-server-host: ${ip.wazuh}
    wazuh-api-server: http://${ip.wazuh}:15500
    wazuh-api-pass: Abcd123#
    wazuh-es-server: http://${ip.es}:9205
    wazuh-godfs-server: http://${ip.wazuh}:11888
    wazuh-godfs-outer-http-server: /mp_scene_collection_godfs
    wazuh-run-command-http-callback-url: http://${ip.self}:${port.self-callback}/api/mp/scene_plugin_collection/wazuh_run_command_result

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings, caches, env, scheduledtasks
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs



---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: ${user.home}/logs

