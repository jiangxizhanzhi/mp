server:
  servlet:
    context-path: /api
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://10.100.0.101:3306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
#    url: jdbc:mysql://127.0.0.1:3306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  flyway:
    clean-disabled: true
  application:
    name: mp

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 请求云平台组信息的url配置，必需填写
mp:
  openstack:
    url: http://10.100.7.140:10009/v1
  datasandtable:
    group-url: http://10.100.7.50:5079/v1/scenes
    moloch:
      username: api
      password: api
    es-nodes: 10.100.7.50:9200
  log:
    exclude-uri: /login
    exclude-method: OPTIONS


management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: /home/mp/logs

---
# 文件服务器地址
file_server_addr: http://192.168.5.68:80
# 最大连接数 并发量较大的话可加大该连接数
max_storage_connection: 8
