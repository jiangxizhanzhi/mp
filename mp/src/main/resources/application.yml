  mariadb: 10.100.1.12        # MP新中台mariadb数据库地址
  fdfs: 10.100.1.26             # FastDFS地址
  cp: 10.100.7.1                # 云平台适配层接口地址
  moloch: 10.100.0.101          # moloch的IP地址
  wazuh: 10.100.7.1           # wazuh的IP地址
  es: 10.100.0.101                 # MP新中台ES地址
  rabbitmq: 10.100.0.101        # rabbitmq地址
  mp: 10.100.1.12:8001                       # MP中台地址
port:
  self-callback: 8080
server:
  servlet:
    context-path: /api/mp
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${ip.mariadb}:9306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: mp
    password: bymsoSAGToyAcs9H
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    clean-disabled: true
    enabled: false
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  rabbitmq:
    host: ${ip.rabbitmq}
    port: 5673
    username: guest
    password: guest
  web:
    resources:
      static-locations: file:${user.home}/img


logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs
    max-file-size: 300MB
    max-total-size: 650MB
    max-row-length: 2000
  logback:
    rollingpolicy:
      max-history: 15
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
springfox:
  documentation:
    enabled: ${SWAGGER_DOC_ENABLED:true}
    auto-startup: ${SWAGGER_DOC_STARTUP:true}
    swagger-ui:
      enabled: ${SWAGGER_DOC_UI:true}

