server:
  servlet:
    context-path: /api/mp
  port: 8080
  tomcat:
    threads:
      min-spare: 10
      max: 200

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

management:
  endpoints:
    web:
      exposure:
        include: health, info
    enabled-by-default: ${MP_ENDPOINTS_ENABLE:true}
  info:
    git:
      mode: simple
  health:
    elasticsearch:
      enabled: false

spring:
  profiles:
    active: dev
    group:
      "dev": "std,ext,local"
      "test": "std,ext"
      "prod": "std,ext"

---
spring:
  config:
    activate:
      on-profile: std

knife4j:
  production: true # 开启屏蔽文档资源

logging:
  file:
    path: /home/mp/logs
mp:
  base:
    run-init: true
  auth:
    authenticate-exclude-urls: /unauth/**,/sys/activation,/sys/activation/reset_menu_visibility,/sys/activation/license_status,/sys/activation/status,/sys/activation/machinecode,/sys/config/public,/config/single_ip,/file/**,/suricata/rule/file_path,/devops/cluster/out_interface/**,/devops/cluster/xd_source/**
  frontbusiness:
    url-ac-filter-exclude-urls: /api/mp/actuator/info,/api/mp/actuator/health,/api/mp/config/single_ip,/api/mp/file/**,/api/mp/actuator/**,/api/mp/error,/api/mp/suricata/rule/file_path
  xdapp:
    xd-one-server: ${XD_ONE_SERVER:http://192.168.140.4:10060}
    xd-two-server: ${XD_TWO_SERVER:https://192.168.140.15}
    xd-two-access-key: ${XD_TWO_ACCESS_KEY:e2a21753c0904c299512408b8ea97372}
    xd-two-secret-key: ${XD_TWO_SECRET_KEY:769ce2d564fa4399b1ade854daccde19}
    xd-two-device-id: ${XD_TWO_DEVICE_ID:90008441-524e-4502-b7d2-c32f94f4734d}
    xd-two-port-id: ${XD_TWO_PORT_ID:8121cd49-cbdf-485f-bea1-53609c33ee29}
    xd-two-ip-pool-start: ${XD_TWO_IP_POOL_START:192.168.140.76}
    xd-two-ip-pool-end: ${XD_TWO_IP_POOL_END:192.168.140.225}
    xd-two-ip-netmask: ${XD_TWO_IP_NETMASK:255.255.255.0}
    xd-two-ip-gateway: ${XD_TWO_IP_GATEWAY:192.168.140.254}
    xd-two-ip-reviewed-free: ${XD_TWO_IP_REVIEWED_FREE:}
    xd-two-ip-on-demand-probe-range: ${XD_TWO_IP_ON_DEMAND_PROBE_RANGE:192.168.140.76-192.168.140.225}
    xd-two-ip-probe-enabled: ${XD_TWO_IP_PROBE_ENABLED:true}
    xd-two-ip-probe-timeout-ms: ${XD_TWO_IP_PROBE_TIMEOUT_MS:1000}
    xd-two-create-confirm-timeout-ms: ${XD_TWO_CREATE_CONFIRM_TIMEOUT_MS:300000}
    xd-two-create-confirm-poll-ms: ${XD_TWO_CREATE_CONFIRM_POLL_MS:3000}
    xd-two-recycle-stop-timeout-ms: ${XD_TWO_RECYCLE_STOP_TIMEOUT_MS:120000}
    xd-two-recycle-delete-timeout-ms: ${XD_TWO_RECYCLE_DELETE_TIMEOUT_MS:120000}
    xd-two-recovery-poll-ms: ${XD_TWO_RECOVERY_POLL_MS:3000}
    xd-two-allocation-recovery-timeout-ms: ${XD_TWO_ALLOCATION_RECOVERY_TIMEOUT_MS:300000}
    xd-three-server: ${XD_THREE_SERVER:http://192.168.140.20:5701}
    xd-three-network-id: ${XD_THREE_NETWORK_ID:36eca7b1-5fe7-48a5-be8e-19f1a01017d2}
    xd-three-clone-timeout-ms: ${XD_THREE_CLONE_TIMEOUT_MS:600000}
    xd-three-network-timeout-ms: ${XD_THREE_NETWORK_TIMEOUT_MS:120000}
    xd-three-ready-timeout-ms: ${XD_THREE_READY_TIMEOUT_MS:600000}
    xd-three-delete-timeout-ms: ${XD_THREE_DELETE_TIMEOUT_MS:300000}
    xd-three-poll-ms: ${XD_THREE_POLL_MS:3000}

---
spring:
  config:
    activate:
      on-profile: ext

---
spring:
  config:
    activate:
      on-profile: local

logging:
  file:
    path: ${user.home}/logs

mp:
  base:
    run-init: false
  auth:
    authenticate-exclude-urls: /unauth/**,/sys/activation,/sys/activation/reset_menu_visibility,/sys/activation/license_status,/sys/activation/status,/sys/activation/machinecode,/sys/config/public,/config/single_ip,/file/**,/actuator/**,/suricata/rule/file_path,/devops/cluster/out_interface/**,/devops/cluster/xd_source/**
  frontbusiness:
    url-ac-filter-exclude-urls: /api/mp/actuator/info,/api/mp/actuator/health,/api/mp/config/single_ip,/api/mp/file/**,/api/mp/actuator/**,/api/mp/error,/api/mp/suricata/rule/file_path
