server:
  servlet:
    context-path: /api
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://10.100.9.150:3306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  flyway:
    clean-disabled: true
  application:
    name: mp

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 请求云平台组信息的url配置，必需填写
mp:
  datasandtable:
    group-url: http://10.100.7.50:5079/v1/scenes
    moloch:
      username: api
      password: api
    es-nodes: 10.100.7.50:9200
  log:
    exclude-uri: /login
    exclude-method: OPTIONS


management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: /home/mp/logs