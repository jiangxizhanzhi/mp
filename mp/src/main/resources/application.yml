server:
  servlet:
    context-path: /api/mp
  port: 8080
  tomcat:
    threads:
      min-spare: ${MP_TOMCAT_MIN_POOL_SIZE:10}
      max: ${MP_TOMCAT_MAX_POOL_SIZE:200}
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${MP_DB_IP:10.100.27.1}:${MP_DB_PORT:3306}/${MP_DB_DATABASE:mp}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: ${MP_DB_USERNAME:mp}
    password: ${MP_DB_PASSWORD:YjViMjg0Y2RiZWRh}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${MP_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${MP_DB_MIN_POOL_SIZE:10}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    clean-disabled: true
    enabled: ${MP_FLYWAY_ENABLED_VALUE:false}
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 3072MB
      max-request-size: 10000MB
  rabbitmq:
    host: ${RABBITMQ_IP:10.4.1.16}
    port: ${RABBITMQ_PORT:9672}
    username: ${RABBITMQ_USERNAME:cpcloud}
    password: ${RABBITMQ_PASSWORD:MzhhMzU4NDQzNzU}
  web:
    resources:
      static-locations: file:/root/.mp/resources/default_img

logging:
  config: classpath:logback-spring.xml
  level:
    ext-var:
      root: ${ROOT_LEVEL:INFO}
    root: ${logging.level.ext-var.root}
  file:
    max-file-size: ${MP_LOGFILE_MAX_FILE_SIZE:300MB}
    max-total-size: ${MP_LOGFILE_MAX_TOTAL_SIZE:650MB}
    max-row-length: ${MP_LOGFILE_MAX_ROW_LENGTH:4000}
    path: ${MP_LOG_FILE_PATH:/home/mp/logs}
  logback:
    rollingpolicy:
      max-history: ${MP_LOGFILE_MAX_HISTORY:15}

springfox:
  documentation:
    enabled: ${SWAGGER_DOC_ENABLED:false}
    auto-startup: ${SWAGGER_DOC_STARTUP:false}
    swagger-ui:
      enabled: ${SWAGGER_DOC_UI:false}

knife4j:
  production: true # 开启屏蔽文档资源

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  info:
    git:
      mode: simple
  health:
    elasticsearch:
      enabled: false

# 中台各模块相关配置
mp:
  common: #公用配置
    cp-ip: ${CP_IP:10.4.1.16}                # 云平台适配层接口地址
    cp-port: ${CP_PORT:11111}                # 云平台适配层接口地址
    mp-ip: ${MP_API_IP:10.4.1.16}          # MP中台地址
    mp-port: ${MP_API_PORT:8001}           # MP中台地址       # MP中台地址
  base:
    run-init: ${MP_RUN_INIT:true}
    fdfs-tracker-servers:
      - ${FDFS_IP:10.4.1.16}:${FDFS_TRACKER_SERVERS_PORT:22122}
    fdfs-inner-http-server: http://${FDFS_IP:10.4.1.16}:${FDFS_INNER_FILE_SERVER_PORT:8888}
    fdfs-outer-http-server: ${FDFS_FILE_SERVER_ADDR:/fdfs}
    file-server: ${FILE_SERVER:lfs}
    lfs-inner-http-url-template: ${LFS_INNER_HTTP_PROTOCOL:http}://${MP_API_IP:10.4.1.16}:${MP_API_PORT:8001}${LFS_INNER_HTTP_URL:/api/mp/file/%s}
    lfs-outer-http-url-template: ${LFS_OUTER_HTTP_URL:/api/mp/file/%s}
  # mp-devops-cluster模块
  devopscluster:
    cp-url: http://${CP_IP:10.4.1.16}:${CP_PORT:11111} #云平台地址
    public-net-proxy: ${MP_PUBLIC_NET_PROXY:false} #公网开关
    public-net-proxy-ip: ${MP_PUBLIC_NET_PROXY_IP:} #公网ip
    public-net-proxy-port: ${PUBLIC_NET_PROXY_PORT:} #公网端口
    public-net-proxy-server: ${MP_PUBLIC_NET_PROXY_SERVER:false}
    public-net-proxy-exclude-protocols: ${MP_PUBLIC_NET_PROXY_EXCLUDE_PROTOCOLS:console,vnc,ssh,telnet,rdp}
    hostname: controller  #主机名称
    max-target-size: 100  # 承诺最大支持靶标的磁盘大小(G)
    disk-alarm-percent: 80 # 磁盘空间告警阈值
    cp-ip: ${CP_IP:10.4.1.16}                # 云平台适配层接口地址
    cp-port: ${CP_PORT:11111}                # 云平台适配层接口地址
    mp-ip: ${MP_API_IP:10.4.1.16}          # MP中台地址
    mp-port: ${MP_API_PORT:8001}           # MP中台地址
    allow-export: ${MP_ALLOW_EXPORT:false}
  # mp-situationaware 模块配置
  situationaware:
    # monitor
    monitor-cp-cloud-interval: ${MP_MONITOR_CP_SRV_INTERVAL:}
    monitor-business-interval: ${MP_MONITOR_BIZ_SRV_INTERVAL:}
    monitor-cp-cloud-server-list: ${MP_MONITOR_CP_SERVER_LIST:}
    monitor-business-server-list: ${MP_MONITOR_BIZ_SERVER_LIST:}
    monitor-cp-cloud-restart-restrict: ${MP_MONITOR_CP_SRV_RESTART_RESTRICT_LIST:}
    monitor-business-restart-restrict: ${MP_MONITOR_BIZ_SRV_RESTART_RESTRICT_LIST:}
    # arkime
    arkime-cpcloud-container-create-url: http://${CP_IP:10.4.1.16}:11111/v1
    arkime-cpcloud-network-mirror-url: http://${CP_IP:10.4.1.16}:11111/cpcloud/sdn_app/v1
    arkime-es-host: ${ARKIME_ES_IP:10.4.1.16}
    arkime-es-port: ${ARKIME_ES_PORT:9205}
    arkime-image-name: ${ARKIME_IMAGE_NAME:mp_arkime:v2}
    arkime-disk: ${ARKIME_DISK:50}
    arkime-cpu: ${ARKIME_CPU:4}
    arkime-ram: ${ARKIME_RAM:4096}
    arkime-username: api
    arkime-password: api
    #wazuh 开放接口地址用户名密码
    wazuh-base-url: http://${WAZUH_IP:10.4.1.16}:${WAZUH_PORT:15500}
    wazuh-username: ${WAZUH_USERNAME:wazuh}
    wazuh-password: ${WAZUH_PASSWORD:Abcd123#}
    wazuh-flow-table-url: http://${CP_IP:10.4.1.16}:9999/knapsack/probe/v1
    # wazuh-probe-manager
    probe-mgr-url: http://${WAZUH_IP:10.4.1.16}:${WAZUH_PORT:15500}
    probe-mgr-agent-script-linux-path: ${WAZUH_AGENT_SCRIPT_LINUX_PATH:/var/ossec/etc/shared/scripts/}
    probe-mgr-agent-script-windows-path: ${WAZUH_AGENT_SCRIPT_WINDOWS_PATH:C:\ossec-agent\shared\scripts\}
    probe-mgr-task-enable: true
    # wazuh es节点地址
    wazuh-es-nodes: ${WAZUH_ES_IP:10.4.1.16}:${WAZUH_ES_PORT:9205}
    wazuh-es-max-page-size: ${ES_MAX_PAGESIZE:10000}
    # arkime es 地址
    arkime-es-nodes: ${ARKIME_ES_IP:10.4.1.16}:${ARKIME_ES_PORT:9205}
    # es 日期格式
    es-date-pattern: ${ES_DATE_PATTERN:yyyy-MM-dd'T'HH:mm:ss.SSSZ}
  # mp-log 模块
  log:
    exclude-urls: ${DEVOPS_LOG_EXCLUDE_URLS:/login}
    exclude-methods: ${DEVOPS_LOG_EXCLUDE_METHODS:OPTIONS}
    es-nodes: ${LOG_ES_IP:10.4.1.16}:${LOG_ES_PORT:9205}
    cp-url: http://${CP_IP:10.4.1.16}:11111 #云平台地址
    mp-ip: ${MP_API_IP:10.4.1.16}    # MP中台API地址
    log-db: ${MP_DEVOPS_LOG_DB:sql} #日志存储数据库可以配置：sql
    es-max-page-size: ${ES_MAX_PAGESIZE:10000}
    dynamic-level-keeping: ${DYNAMIC_LEVEL_KEEPING:true} #动态日志级别保持
    dynamic-level-only-root: ${DYNAMIC_LEVEL_ONLY_ROOT:false}
  # mp-auth 模块配置
  auth:
    max-import-user-size: ${MP_MAX_IMPORT_USER_SIZE:1000}
    logout-reset-secret: ${MP_AUTH_LOGOUT_RESET_SECRET:true}
    logout-keep-secret-user: ${MP_AUTH_LOGOUT_KEEP_SECRET_USER:3cf215471268482c88a9986283e38c27}
    default-user-avatar: ${MP_AUTH_DEFAULT_USER_AVATAR:/api/mp/avatar/1.png}
    mq-msg-timeout: ${MP_AUTH_MQ_MSG_TIMEOUT:3600000}
    # authenticate
    authenticate-cache-time: ${MP_AUTH_CACHE_TIME:30}
    authenticate-use-individual-token-secret: ${MP_AUTH_USE_INDIVIDUAL_TOKEN_SECRET:true}
    authenticate-jwt-secret: ${MP_AUTH_JWT_SECRET:a668b6fec22144f38a6f72f8a5aa7326}
    authenticate-jwt-expires: ${MP_AUTH_JWT_EXPIRES:604800}
    authenticate-urls: ${MP_AUTH_URLS:/auth/**,/sys/**,/flow/**,/cscene/**,/devops/**,/agg/**,/common/**,/collection/**,/probes/**,/wazuh/**,/sessions/**,/flow_group/**}
    authenticate-encoder-iterations: ${MP_AUTH_ENCODER_ITERATIONS:10000}
    authenticate-encoder-hash-width: ${MP_AUTH_ENCODER_HASHWIDTH:256}
    authenticate-exclude-urls: /unauth/**,/sys/activation,/sys/activation/reset_menu_visibility,/sys/activation/license_status,/sys/activation/status,/sys/activation/machinecode,/sys/config/public,/config/single_ip,/file/**,/suricata/rule/file_path
  # mp-front-admin 模块配置
  frontadmin:
    activ-enable: true
    license-dir: /home/mp/config/license
    license-remind-enable: true
    # license到期提醒时间，默认剩余30天提醒
    license-remind-time: 30
  # mp-front-business 模块配置
  frontbusiness:
    url-ac-filter-enabled: ${MP_FRONTBUSINESS_URLACFILTER_ENABLED:true}
    showai: ${MP_SHOW_AI:false}
    url-ac-filter-method-match: true
    url-ac-filter-authority-match: true
    url-ac-filter-ignore-if-not-defined: false
    url-ac-filter-exclude-urls: /api/mp/actuator/info,/api/mp/actuator/health,/api/mp/config/single_ip,/api/mp/file/**,/api/mp/actuator/**,/api/mp/error,/api/mp/suricata/rule/file_path
  # mp-flow 模块配置
  flow:
    trex-image: ${TREX_IMAGE:tgn-trex}
    cp-url: http://${CP_IP:10.4.1.16}:${CP_PORT:11111} #云平台地址
  sceneplugincloud:
    cpcloud-server: http://${CP_IP:10.4.1.16}:${CP_PORT:11111}
    delete-retry-times: ${MP_DELETE_RETRY_TIMES:2}
    default-core-router-name: ${MP_DEFAULT_CORE_ROUTER_NAME:Router}
    enable-reallocate-ip-ports: ${MP_ENABLE_REALLOCATE_IP_PORTS:false}
    link-status-enabled: ${MP_LINK_STATUS_ENABLED:true}
    link-status-refresh-period: ${MP_LINK_STATUS_REFRESH_PERIOD:5}
    link-status-cache-seconds: ${MP_LINK_STATUS_CACHE_SECONDS:600}
    link-status-pool-size: ${MP_LINK_STATUS_POOL_SIZE:10}
    link-status-hold-size: ${MP_LINK_STATUS_HOLD_SIZE:200}
    public-net-proxy-server: ${MP_PUBLIC_NET_PROXY_SERVER:false}
    public-net-proxy: ${MP_PUBLIC_NET_PROXY:false}
    public-net-proxy-ip: ${MP_PUBLIC_NET_PROXY_IP:}
    public-net-proxy-port: ${PUBLIC_NET_PROXY_PORT:}
    gateway-types: ${GATEWAY_TYPES:2,3}
    cpcloud-server-timeout: ${MP_CPCLOUD_SERVER_TIMEOUT:600000}
    cpcloud-http-pool-size: ${MP_CPLOUD_HTTP_POOL_SIZE:200}
    initiate-pool-size: ${MP_INITIATE_POOL_SIZE:100}
    initiate-hold-size: ${MP_INITIATE_HOLD_SIZE:20000}
    create-pool-size: ${MP_CREATE_POOL_SIZE:10}
    create-hold-size: ${MP_CREATE_HOLD_SIZE:20000}
    delete-pool-size: ${MP_DELETE_POOL_SIZE:10}
    cloud-heavy-concurrent-delay-enable: ${MP_CLOUD_HEAVY_CONCURRENT_DELAY_ENABLE:true}
    cloud-heavy-concurrent-delay: ${MP_CLOUD_HEAVY_CONCURRENT_DELAY:10}
    scene-create-install-unzip-apk: ${MP_SCENE_CREATE_INSTALL_UNZIP_APK:true}
    dhcp-ip-allocate: ${MP_DHCP_IP_ALLOCATE:true}
  sceneplugincollection:
    wazuh-server-host: ${WAZUH_IP:10.4.1.16}
    wazuh-api-server: http://${WAZUH_IP:10.4.1.16}:15500
    wazuh-api-pass: Abcd123#
    wazuh-es-server: http://${WAZUH_ES_IP:10.4.1.16}:9205
    wazuh-godfs-server: http://${WAZUH_ES_IP:10.4.1.16}:11888
    wazuh-godfs-outer-http-server: /mp_scene_collection_godfs
    wazuh-run-command-http-callback-url: http://${WAZUH_ES_IP:10.4.1.16}:${MP_SELF_PORT:8001}/api/mp/scene_plugin_collection/wazuh_run_command_result
  cscene:
    has-own-recording-set: ${HAS_OWN_RECORDING_SET:213,214,236}
    scene-error-creating-seconds: ${MP_SCENE_ERROR_CREATING_SECONDS:3600}
    element-error-creating-seconds: ${MP_ELEMENT_ERROR_CREATING_SECONDS:300}
    ignore-scene-creating-seconds: ${MP_IGNORE_SCENE_CREATING_SECONDS:120}
    enable-scene-cron-job: ${MP_ENABLE_SCENE_CRON_JOB:true}
    enable-command-change: ${MP_ENABLE_COMMAND_CHANGE:false}
    cron-job-expression: ${MP_CRON_JOB_EXPRESSION:0 0/15 * * * ?}
    enable-node-limit-db-check: ${MP_ENABLE_NODE_LIMIT_DB_CHECK:true}
    default-container-cpu-count: ${MP_DEFAULT_CONTAINER_CPU_COUNT:1}
    default-container-ram-count: ${MP_DEFAULT_CONTAINER_RAM_COUNT:512}
    default-container-disk-count: ${MP_DEFAULT_CONTAINER_DISK_COUNT:10}
    cp-ip: ${CP_IP:10.4.1.16}
    cp-port: ${CP_PORT:11111}
  scene:
    scene-pool-size: ${MP_SCENE_POOL_SIZE:100}
    scene-hold-size: ${MP_SCENE_HOLD_SIZE:10000}
    element-pool-size: ${MP_ELEMENT_POOL_SIZE:100}
    element-hold-size: ${MP_ELEMENT_HOLD_SIZE:10000}
    scene-handler-realtime-update: ${MP_SCENE_HANDLER_REALTIME_UPDATE:true}
    scene-process-save-realtime: ${MP_SCENE_PROCESS_SAVE_REALTIME:true}
    element-process-save-realtime: ${MP_ELEMENT_PROCESS_SAVE_REALTIME:true}
    dhcp-control: ${MP_SCENE_DHCP_CONTROL:false}
    metadata-file-server: ${MP_METADATA_FILE_SERVER:http://169.254.169.254/file}
  aggregation:
    export-image-timeout: ${MP_EXPORT_IMAGE_TIMEOUT:1200000}

# for kaptcha
kaptcha:
  border:
    enabled: true
    color: '200,200,200'
    thickness: 1
  image:
    width: 200
    height: 60
  text-producer:
    impl:
    character:
      string: ${MP_AUTH_TEXT_SECRET:'0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'}
      length: 4
      space: 10