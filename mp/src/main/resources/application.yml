server:
  servlet:
    context-path: /api/mp
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://10.100.0.101:3306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  flyway:
    clean-disabled: true
  application:
    name: mp

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 请求云平台组信息的url配置，必需填写
mp:
  base:
    mg-url: http://10.100.14.252:8077
    fdfs-url: 10.100.14.252  # fdfs服务器地址
    # fastdfs配置
    fastdfs:
      max-storage-connection: 8   # 最大连接数
      connect-timeout-in-seconds: 10
      network-timeout-in-seconds: 30
      charset: UTF-8
      http-tracker-http-port: 80
      groups:
        # 集群配置：每增加一个集群，参考下例添加相应配置即可，同时在FdfsGroupEnum.java枚举类中添加该集群名称
        - group-name: DEFAULT    # 集群名称
          tracker-servers: ${mp.base.fdfs-url}:22122
          file-server-addr: /fdfs    # 外部文件服务器地址
          inner-file-server-addr: http://${mp.base.fdfs-url}:8888   # 内部文件服务器地址
  devops:
    cp-url: http://10.100.7.5:11111 #云平台地址
    cr-url: http://10.100.2.21 #
    hostname: controller  #主机名称
  datasandtable:
    group-url: http://10.100.14.107:5079/v1/scenes
    moloch:
      username: api
      password: api
    #moloch es节点地址
    es-nodes: 10.100.14.107:9200
    wazuh:
      #wazuh 开放接口地址
      base-url: https://10.100.14.106:55000
      #wazuh 开放接口用户名密码
      username: acme-user
      password: MyS3cr37P450r.*-
      #wazuh es地址用户名密码
      es-url: 10.100.14.106
      es-port: 9200
      es-username: admin
      es-password: SecretPassword
    wazuh-probe-manager:
      url: http://10.100.0.102:8002
      agent-script-linux-path: /var/ossec/etc/shared/scripts/
      agent-script-windows-path: C:\ossec-agent\shared\scripts\
  log:
    exclude-uri: /login
    exclude-method: OPTIONS


management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: /home/mp/logs
