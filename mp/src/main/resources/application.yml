server:
  servlet:
    context-path: /api/mp
  port: 8080
  tomcat:
    threads:
      min-spare: 10
      max: 200


spring:
  datasource:
    url: jdbc:mysql://10.100.1.12:9306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: root
    password: cyberpeace@2020
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    clean-disabled: true
    enabled: false
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  rabbitmq:
    host: 10.100.0.101
    port: 5673
    username: guest
    password: guest
  web:
    resources:
      static-locations: file:${user.home}/img


logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs
    max-file-size: 300MB
    max-total-size: 650MB
    max-row-length: 2000
  logback:
    rollingpolicy:
      max-history: 15
springfox:
  documentation:
    enabled: ${SWAGGER_DOC_ENABLED:true}
    auto-startup: ${SWAGGER_DOC_STARTUP:true}
    swagger-ui:
      enabled: ${SWAGGER_DOC_UI:true}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings, caches, env, scheduledtasks
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false

# 中台各模块相关配置
mp:
  base:
    fdfs-tracker-servers:
        - 10.100.1.26:22122
    fdfs-inner-http-server: http://10.100.1.26:8888
    fdfs-outer-http-server: /fdfs

  # mp-devops-cluster 配置
  devopscluster:
    # cp-url: http://10.100.7.1:111 #云平台地址
    cp-url: http://10.100.7.1:11111 #云平台地址
    public-net-proxy: false #公网开关
    public-net-proxy-ip: 10.100.7.1 #公网ip
    public-net-proxy-port: 11111 #公网端口
    public-net-proxy-server: false
    public-net-proxy-exclude-protocols: console,vnc,ssh,telnet,rdp
    hostname: controller  #主机名称
    max-target-size: 100  # 承诺最大支持靶标的磁盘大小(G)
    disk-alarm-percent: 80 # 磁盘空间告警阈值
    cp-ip: 10.100.7.1                # 云平台适配层接口地址
    mp-ip: 10.100.1.12:8001          # MP中台地址
  # mp-situationaware 模块配置
  situationaware:
    # monitor
    monitor-cp-cloud-interval:
    monitor-business-interval:
    monitor-cp-cloud-server-list:
    monitor-business-server-list:
    monitor-cp-cloud-restart-restrict:
    monitor-business-restart-restrict:
    # arkime
    arkime-cpcloud-container-create-url: http://10.100.7.1:11111/v1
    arkime-cpcloud-network-mirror-url: http://10.100.7.1:11111/cpcloud/sdn_app/v1
    arkime-es-host: 10.100.0.101
    arkime-es-port: 9205
    arkime-image-name: centos-arkime_arkime:v2
    arkime-username: api
    arkime-password: api
    #wazuh 开放接口地址开放接口用户名密码
    wazuh-base-url: http://10.100.7.1:15500
    wazuh-username: wazuh
    wazuh-password: Abcd123#
    wazuh-flow-table-url: http://10.100.7.1:9999/knapsack/probe/v1
    # wazuh-probe-manager
    probe-mgr-url: http://10.100.0.111:8002
    probe-mgr-agent-script-linux-path: /var/ossec/etc/shared/scripts/
    probe-mgr-agent-script-windows-path: C:\ossec-agent\shared\scripts\
    probe-mgr-task-enable: false
    # wazuh es节点地址
    wazuh-es-nodes: 10.100.0.101:9205
    # arkime es 地址
    arkime-es-nodes: 10.100.0.101:9205
    # es 日期格式
    es-date-pattern: yyyy-MM-dd'T'HH:mm:ss.SSSZ
  # mp-devops-log 模块配置
  devopslog:
    exclude-urls: /login
    exclude-methods: OPTIONS
    es-nodes: 10.100.0.101:9205
    cp-url: http://10.100.7.1:11111 #云平台地址
    mp-ip: 10.100.1.12:8001       # MP中台地址
    log-db: mysql #日志存储数据库：es、mysql
  # mp-auth 模块配置
  auth:
    max-import-user-size: 100
    logout-reset-secret: true
    default-user-avatar: /api/mp/avatar/1.png
    # authenticate
    authenticate-cache-time: 30
    authenticate-use-individual-token-secret: true
    authenticate-jwt-secret: a668b6fec22144f38a6f72f8a5aa7326
    authenticate-jwt-expires: 604800
    authenticate-urls: /auth/**,/sys/**,/flow/**,/cscene/**,/devops/**,/aggr/**
    authenticate-exclude-urls: /unauth/**,/sys/activation,/sys/activation/license_status,/sys/activation/machinecode,/sys/config/public
    authenticate-encoder-iterations:
    authenticate-encoder-hash-width:
  # mp-front-admin 模块配置
  frontadmin:
    activ-enable: true
    license-dir: /home/mp/config/license
  # mp-front-business 模块配置
  frontbusiness:
    url-ac-filter-enabled: true
    url-ac-filter-method-match: true
    url-ac-filter-authority-match: true
    url-ac-filter-ignore-if-not-defined: false
    url-ac-filter-exclude-urls: /api/mp/actuator/**
  # mp-flow 模块配置
  flow:
    trex-image: tgn-trex
    cp-url: http://10.100.7.1:11111 #云平台地址
  sceneplugincloud:
    cpcloud-server: http://10.100.7.1:11111
    delete-retry-times: 2
    default-core-router-name: Router
    enable-reallocate-ip-ports: false
    link-status-enabled: true
    link-status-refresh-period: 5
    link-status-cache-seconds: 600
    link-status-pool-size: 10
    link-status-hold-size: 200
    public-net-proxy-server: false
    public-net-proxy: false
    public-net-proxy-ip:
    public-net-proxy-port:
    gateway-types: 2,3
    cpcloud-http-pool-size: 200
    initiate-pool-size: 10
    initiate-hold-size: 20000
    create-pool-size: 10
    create-hold-size: 20000
    cloud-heavy-concurrent-delay-enable: true
    cloud-heavy-concurrent-delay: 10
    scene-create-install-unzip-apk: true
    dhcp-ip_allocate: true
  sceneplugincollection:
    wazuh-server-host: 10.100.7.1
    wazuh-api-server: http://10.100.7.1:15500
    wazuh-api-pass: Abcd123#
    wazuh-es-server: http://10.100.0.101:9205
    wazuh-godfs-server: http://10.100.7.1:11888
    wazuh-godfs-outer-http-server: /mp_scene_collection_godfs
    wazuh-run-command-http-callback-url: http://mp:8080/api/mp/scene_plugin_collection/wazuh_run_command_result
  sceneplugingns3:
    gns3-server: http://10.100.7.1:8088
  cscene:
    has-own-recording-set: 213,214,236
    scene-error-creating-seconds: 3600
    element-error-creating-seconds: 300
    ignore-scene-creating-seconds: 120
    enable-scene-cron-job: true
    enable-command-change: false
    cron-job-expression: 0 0/15 * * * ?
    enable-node-limit-db-check: true
    cp-ip: 10.100.7.1
  scene:
    scene-pool-size: 100
    scene-hold-size: 10000
    element-pool-size: 100
    element-hold-size: 10000
    scene-handler-realtime-update: true
    scene-process-save-realtime: true
    element-process-save-realtime: true


---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs



---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: ${user.home}/logs

