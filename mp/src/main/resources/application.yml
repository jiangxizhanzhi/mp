server:
  servlet:
    context-path: /api/mp
  port: 8080
  tomcat:
    threads:
      min-spare: 10
      max: 200

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

management:
  endpoints:
    web:
      exposure:
        include: health, info
    enabled-by-default: ${MP_ENDPOINTS_ENABLE:true}
  info:
    git:
      mode: simple
  health:
    elasticsearch:
      enabled: false

spring:
  profiles:
    active: dev
    group:
      "dev": "std,ext,local"
      "test": "std,ext"
      "prod": "std,ext"

---
spring:
  config:
    activate:
      on-profile: std

knife4j:
  production: true # 开启屏蔽文档资源

logging:
  file:
    path: /home/mp/logs
mp:
  base:
    run-init: true
  auth:
    authenticate-exclude-urls: /unauth/**,/sys/activation,/sys/activation/reset_menu_visibility,/sys/activation/license_status,/sys/activation/status,/sys/activation/machinecode,/sys/config/public,/config/single_ip,/file/**,/suricata/rule/file_path,/devops/cluster/out_interface/**
  frontbusiness:
    url-ac-filter-exclude-urls: /api/mp/actuator/info,/api/mp/actuator/health,/api/mp/config/single_ip,/api/mp/file/**,/api/mp/actuator/**,/api/mp/error,/api/mp/suricata/rule/file_path
  xdapp:
    xd-one-server: ${XD_ONE_SERVER:http://192.168.140.4:10060}

---
spring:
  config:
    activate:
      on-profile: ext

---
spring:
  config:
    activate:
      on-profile: local

logging:
  file:
    path: ${user.home}/logs

mp:
  base:
    run-init: false
  auth:
    authenticate-exclude-urls: /unauth/**,/sys/activation,/sys/activation/reset_menu_visibility,/sys/activation/license_status,/sys/activation/status,/sys/activation/machinecode,/sys/config/public,/config/single_ip,/file/**,/actuator/**,/suricata/rule/file_path,/devops/cluster/out_interface/**
  frontbusiness:
    url-ac-filter-exclude-urls: /api/mp/actuator/info,/api/mp/actuator/health,/api/mp/config/single_ip,/api/mp/file/**,/api/mp/actuator/**,/api/mp/error,/api/mp/suricata/rule/file_path