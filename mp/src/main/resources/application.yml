server:
  servlet:
    context-path: /api/mp
  port: 8080
  tomcat:
    threads:
      min-spare: 10
      max: 200

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    git:
      mode: simple
  health:
    elasticsearch:
      enabled: false

spring:
  profiles:
    active: prod
    group:
      "dev": "std,ext,local"
      "test": "std,ext"
      "prod": "std,ext"

---
spring:
  config:
    activate:
      on-profile: std
mp:
  base:
    run-init: true

---
spring:
  config:
    activate:
      on-profile: ext

---
spring:
  config:
    activate:
      on-profile: local
mp:
  base:
    run-init: false
