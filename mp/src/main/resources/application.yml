server:
  port: 8080

spring:
  datasource:
    name: mp
    url: jdbc:mysql://localhost:3306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    clean-disabled: true
  messages:
    basename: i18n/messages

logging:
  file:
    name: log/log.log

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
