server:
  servlet:
    context-path: /api/mp
  port: 8080
  tomcat:
    threads:
      min-spare: 10
      max: 200


spring:
  datasource:
    url: jdbc:mysql://10.100.7.1:9306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: root
    password: cyberpeace@2020
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    clean-disabled: true
    enabled: false
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  rabbitmq:
    host: 10.100.0.101
    port: 5673
    username: guest
    password: guest
  web:
    resources:
      static-locations: file:${user.home}/img


logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs
    max-file-size: 300MB
    max-total-size: 650MB
    max-row-length: 2000
  logback:
    rollingpolicy:
      max-history: 15
springfox:
  documentation:
    enabled: ${SWAGGER_DOC_ENABLED:true}
    auto-startup: ${SWAGGER_DOC_STARTUP:true}
    swagger-ui:
      enabled: ${SWAGGER_DOC_UI:true}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings, caches, env, scheduledtasks
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false

# 中台各模块相关配置
mp:
  base:
    fdfs-tracker-servers:
        - 10.100.1.26:22122
    fdfs-inner-http-server: http://10.100.1.26:8888
    fdfs-outer-http-server: /fdfs
  # mp-flow 模块配置
  flow:
    trex-image: tgn-trex
    cp-url: http://10.100.7.1:11111 #云平台地址


---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs



---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: ${user.home}/logs

