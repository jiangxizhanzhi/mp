# 中台各模块相关配置
mp:
  base:
    fdfs-tracker-servers:
        - 10.100.1.26:22122
    fdfs-inner-http-server: http://10.100.1.26:8888
    fdfs-outer-http-server: /fdfs

  # mp-devops-cluster 配置
  devopscluster:
    # cp-url: http://10.4.1.20:111 #云平台地址
    cp-url: http://10.4.1.20:11111 #云平台地址
    public-net-proxy: false #公网开关
    public-net-proxy-ip: 10.4.1.20 #公网ip
    public-net-proxy-port: 11111 #公网端口
    public-net-proxy-server: false
    public-net-proxy-exclude-protocols: console,vnc,ssh,telnet,rdp
    hostname: controller  #主机名称
    max-target-size: 100  # 承诺最大支持靶标的磁盘大小(G)
    disk-alarm-percent: 80 # 磁盘空间告警阈值
    cp-ip: 10.4.1.20                # 云平台适配层接口地址
    mp-ip: 10.100.1.12:8001          # MP中台地址
  flow:
    trex-image: tgn-trex
    cp-url: http://10.4.1.20:11111 #云平台地址
  sceneplugincloud:
    cpcloud-server: http://10.4.1.20:11111
    delete-retry-times: 2
    default-core-router-name: Router
    enable-reallocate-ip-ports: false
    link-status-enabled: true
    link-status-refresh-period: 5
    link-status-cache-seconds: 600
    link-status-pool-size: 10
    link-status-hold-size: 200
    public-net-proxy-server: false
    public-net-proxy: false
    public-net-proxy-ip:
    public-net-proxy-port:
    gateway-types: 2,3
    cpcloud-http-pool-size: 200
    initiate-pool-size: 10
    initiate-hold-size: 20000
    create-pool-size: 10
    create-hold-size: 20000
    cloud-heavy-concurrent-delay-enable: true
    cloud-heavy-concurrent-delay: 10
    scene-create-install-unzip-apk: true
    dhcp-ip_allocate: true
  cscene:
    has-own-recording-set: 213,214,236
    scene-error-creating-seconds: 3600
    element-error-creating-seconds: 300
    ignore-scene-creating-seconds: 120
    enable-scene-cron-job: true
    enable-command-change: false
    cron-job-expression: 0 0/15 * * * ?
    enable-node-limit-db-check: true
    cp-ip: 10.4.1.20
  scene:
    scene-pool-size: 100
    scene-hold-size: 10000
    element-pool-size: 100
    element-hold-size: 10000
    scene-handler-realtime-update: true
    scene-process-save-realtime: true
    element-process-save-realtime: true


---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs



---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: ${user.home}/logs

