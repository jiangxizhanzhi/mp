server:
  servlet:
    context-path: /api/mp
  port: 8080
  tomcat:
    threads:
      min-spare: 10
      max: 200

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    git:
      mode: simple
  health:
    elasticsearch:
      enabled: false

spring:
  profiles:
    active: dev
    group:
      "dev": "std,ext,local"
      "test": "std,ext"
      "prod": "std,ext"

---
spring:
  config:
    activate:
      on-profile: std

logging:
  file:
    path: /home/mp/logs
mp:
  base:
    run-init: true
  auth:
    authenticate-exclude-urls: /unauth/**,/sys/activation,/sys/activation/license_status,/sys/activation/machinecode,/sys/config/public,/config/single_ip,/file/**
  frontbusiness:
    url-ac-filter-exclude-urls: /api/mp/actuator/info,/api/mp/actuator/health,/api/mp/config/single_ip,/api/mp/file/**,/api/mp/actuator/**

---
spring:
  config:
    activate:
      on-profile: ext

---
spring:
  config:
    activate:
      on-profile: local

management:
  endpoints:
    health:
      show-details: always
    web:
      exposure:
        include: "*"

logging:
  file:
    path: ${user.home}/logs

mp:
  base:
    run-init: false
  auth:
    authenticate-exclude-urls: /unauth/**,/sys/activation,/sys/activation/license_status,/sys/activation/machinecode,/sys/config/public,/config/single_ip,/file/**,/actuator/**
  frontbusiness:
    url-ac-filter-exclude-urls: /api/mp/actuator/info,/api/mp/actuator/health,/api/mp/config/single_ip,/api/gmp/file/**,/api/mp/actuator/**