server:
  servlet:
    context-path: /api
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://10.100.0.101:3306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  flyway:
    clean-disabled: true
  application:
    name: mp

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 请求云平台组信息的url配置，必需填写
mp:
  openstack:
    url: http://10.100.7.28:11111
    mg-url: http://10.100.2.21
  datasandtable:
    group-url: http://10.100.7.50:5079/v1/scenes
    moloch:
      username: api
      password: api
    es-nodes: 10.100.7.50:9200
    wazuh:
      base-url: https://192.168.5.125:55000
      username: wazuh
      password: wazuh
  log:
    exclude-uri: /login
    exclude-method: OPTIONS


management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: /home/mp/logs

---
mp:
  auth:
    needRegistrationAudit: true
    excel-template-name: 用户列表.xls
    excel-template-path: group1/M00/00/00/wKgFRGDRsliAWdiuAAAmALa0U-o081.xls
  base:
    # fastdfs配置
    fastdfs:
      max-storage-connection: 8   # 最大连接数
      connect-timeout-in-seconds: 10
      network-timeout-in-seconds: 30
      charset: UTF-8
      http-tracker-http-port: 80
      groups:
        # 集群配置：每增加一个集群，参考下例添加相应配置即可，同时在FdfsGroupEnum.java枚举类中添加该集群名称
        - group-name: DEFAULT    # 集群名称
          tracker-servers: 192.168.5.68:22122
          file-server-addr: http://192.168.5.68:80    # 外部文件服务器地址
          inner-file-server-addr: http://192.168.5.68:80    # 内部文件服务器地址
