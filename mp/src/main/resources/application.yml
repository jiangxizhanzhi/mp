ip:
  mariadb: 10.100.0.101        # MP新中台mariadb数据库地址
  fdfs: 10.100.1.26             # FastDFS地址
  cp: 10.100.7.1                # 云平台适配层接口地址
  moloch: 10.100.0.101          # moloch的IP地址
  wazuh: 10.100.7.1           # wazuh的IP地址
  es: 10.100.0.101                 # MP新中台ES地址
  rabbitmq: 10.100.0.101        # rabbitmq地址

server:
  servlet:
    context-path: /api/mp
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${ip.mariadb}:3306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    clean-disabled: true
    enabled: false
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  rabbitmq:
    host: ${ip.rabbitmq}
    port: 5673
    username: guest
    password: guest
  web:
    resources:
      static-locations: file:${user.home}/img


logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs
  logback:
    rollingpolicy:
      max-history: 7
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 请求云平台组信息的url配置，必需填写
mp:
  base:
    # fastdfs配置
    fastdfs:
      max-storage-connection: 8   # 最大连接数
      connect-timeout-in-seconds: 10
      network-timeout-in-seconds: 30
      charset: UTF-8
      http-tracker-http-port: 80
      groups:
        # 集群配置：每增加一个集群，参考下例添加相应配置即可，同时在FdfsGroupEnum.java枚举类中添加该集群名称
        - group-name: DEFAULT    # 集群名称
          tracker-servers: ${ip.fdfs}:22122
          file-server-addr: /fdfs    # 外部文件服务器地址
          inner-file-server-addr: http://${ip.fdfs}:8888   # 内部文件服务器地址
    fdfs-tracker-servers:
        - ${ip.fdfs}:22122
    fdfs-inner-http-server: http://${ip.fdfs}:8888
    fdfs-outer-http-server: /fdfs
  devops:
#    cp-url: http://10.100.7.1:111 #云平台地址
    cp-url: http://${ip.cp}:11111 #云平台地址
    hostname: controller  #主机名称
    max-target-size: 100  # 承诺最大支持靶标的磁盘大小(G)
  situationaware:
    arkime:
      cpcloud-container-create-url: http://${ip.cp}:11111/v1
      cpcloud-network-mirror-url: http://${ip.cp}:11111/cpcloud/sdn_app/v1
      es-host: ${ip.moloch}
      es-port: ${ARKIME_PORT:9205}
      image-name: centos-arkime_arkime:v2
      username: api
      password: api
    #moloch es节点地址
    es-nodes: ${ip.moloch}:9205
    wazuh:
      #wazuh 开放接口地址
      base-url: http://${ip.wazuh}:55000
      #wazuh 开放接口用户名密码
      username: wazuh
      password: wazuh
      flow-table-url: http://${ip.cp}:9999/knapsack/probe/v1
    wazuh-probe-manager:
      url: http://10.100.0.111:8002
      agent-script-linux-path: /var/ossec/etc/shared/scripts/
      agent-script-windows-path: C:\ossec-agent\shared\scripts\
      task-enable: false
  collection:
    #自定义探针配置
    default-interval: 180s
    probes:
      - probe-name: get_host_info.py
        id: eda72998ba654c8d8625f61eaa918eb3
        interval: 180s
        outputFormat: plain
      - probe-name: get_net_conns.py
        id: 09ffcc4a67ef4accb407a1555629d0f8
        interval: 180s
        outputFormat: none

  log:
    es-nodes: ${ip.es}:9205
    exclude-uri: /login
    exclude-method: OPTIONS
  auth:
    activation:
      enable: true
      licenseDir: /home/mp/config/license
  flow:
    trex-image: tgn-0424
  sceneplugincloud:
    cpcloud-server: http://${ip.cp}:11111
  sceneplugincollection:
    wazuh-server-host: ${ip.wazuh}

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs



---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: ${user.home}/logs

