ip:
  self: mp                      # mp自身地址
port:
  self-callback: 8080
server:
  servlet:
    context-path: /api/mp
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://10.100.1.12:9306/mp?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&createDatabaseIfNotExist=true&allowMultiQueries=true
    username: root
    password: cyberpeace@2020
    driver-class-name: org.mariadb.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  flyway:
    clean-disabled: true
    enabled: false
  application:
    name: mp
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 10000MB
  rabbitmq:
    host: 10.100.0.101
    port: 5673
    username: guest
    password: guest
  web:
    resources:
      static-locations: file:${user.home}/img


logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: ${user.home}/logs
    max-file-size: 300MB
    max-total-size: 650MB
    max-row-length: 2000
  logback:
    rollingpolicy:
      max-history: 15
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
springfox:
  documentation:
    enabled: ${SWAGGER_DOC_ENABLED:true}
    auto-startup: ${SWAGGER_DOC_STARTUP:true}
    swagger-ui:
      enabled: ${SWAGGER_DOC_UI:true}

# 请求云平台组信息的url配置，必需填写
mp:
  base:
    fdfs-tracker-servers:
        - 10.100.1.26:22122
    fdfs-inner-http-server: http://10.100.1.26:8888
    fdfs-outer-http-server: /fdfs
  # mp-devops-cluster 配置
  devopscluster:
    # cp-url: http://10.100.7.1:111 #云平台地址
    cp-url: http://10.100.7.1:11111 #云平台地址
    public-net-proxy: false #公网开关
    public-net-proxy-ip: 10.100.7.1 #公网ip
    public-net-proxy-port: 11111 #公网端口
    public-net-proxy-server: false
    hostname: controller  #主机名称
    max-target-size: 100  # 承诺最大支持靶标的磁盘大小(G)
    disk-alarm-percent: 80 # 磁盘空间告警阈值
    cp-ip: 10.100.7.1                # 云平台适配层接口地址
    mp-ip: 10.100.1.12:8001          # MP中台地址
  # mp-situationaware 模块配置
  situationaware:
    # monitor
    monitor:
      cp-cloud-interval:
      business-interval:
      cp-cloud-server-list:
      business-server-list:
      cp-cloud-restart-restrict:
      business-restart-restrict:
    # arkime
    arkime-cpcloud-container-create-url: http://10.100.7.1:11111/v1
    arkime-cpcloud-network-mirror-url: http://10.100.7.1:11111/cpcloud/sdn_app/v1
    arkime-es-host: 10.100.0.101
    arkime-es-port: 9205
    arkime-image-name: centos-arkime_arkime:v2
    arkime-username: api
    arkime-password: api
    #wazuh 开放接口地址开放接口用户名密码
    wazuh-base-url: http://10.100.7.1:15500
    wazuh-username: wazuh
    wazuh-password: Abcd123#
    wazuh-flow-table-url: http://10.100.7.1:9999/knapsack/probe/v1
    # wazuh-probe-manager
    probe-mgr-url: http://10.100.0.111:8002
    probe-mgr-agent-script-linux-path: /var/ossec/etc/shared/scripts/
    probe-mgr-agent-script-windows-path: C:\ossec-agent\shared\scripts\
    probe-mgr-task-enable: false
    # wazuh es节点地址
    wazuh-es-nodes: 10.100.0.101:9205
    # arkime es 地址
    arkime-es-nodes: 10.100.0.101:9205
    # es 日期格式
    es-date-pattern: yyyy-MM-dd'T'HH:mm:ss.SSSZ
  cscene:
    has-own-recording-set: ${HAS_OWN_RECORDING_SET:213,214,236}
  # mp-devops-log 模块配置
  devopslog:
    exclude-uri:
      - /login
    exclude-method:
      - OPTIONS
    es-nodes: 10.100.0.101:9205
    cp-url: http://10.100.7.1:11111 #云平台地址
    mp-ip: 10.100.1.12:8001       # MP中台地址
  # mp-auth 模块配置
  auth:
    max-import-user-size: 100
    logout-reset-secret: true
    default-user-avatar: /api/mp/avatar/1.png
    # authenticate
    authenticate-cache-time: 30
    authenticate-use-individual-token-secret: true
    authenticate-jwt-secret: 38effa66e5454c5d9dd79711fc6ffc4d
    authenticate-jwt-expires: 604800
    authenticate-urls: /auth/**,/sys/notice/**,/systemOperation/**,/flow/**,/cscene/**,/devops/**
    authenticate-encoder-iterations:
    authenticate-encoder-hash-width:
  # mp-front-admin 模块配置
  frontadmin:
    activ-enable: true
    license-dir: /home/mp/config/license
  # mp-front-business 模块配置
  frontbiz:
    url-ac-filter-enabled: true
    url-ac-filter-method-match: true
    url-ac-filter-authority-match: true
    url-ac-filter-ignore-if-not-defined: false
  # mp-flow 模块配置
  flow:
    trex-image: tgn-trex
    cp-url: http://10.100.7.1:11111 #云平台地址
  sceneplugincloud:
    cpcloud-server: http://10.100.7.1:11111
  sceneplugincollection:
    wazuh-server-host: 10.100.7.1
    wazuh-api-server: http://10.100.7.1:15500
    wazuh-api-pass: Abcd123#
    wazuh-es-server: http://10.100.0.101:9205
    wazuh-godfs-server: http://10.100.7.1:11888
    wazuh-godfs-outer-http-server: /mp_scene_collection_godfs
    wazuh-run-command-http-callback-url: http://${ip.self}:${port.self-callback}/api/mp/scene_plugin_collection/wazuh_run_command_result

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings, caches, env, scheduledtasks
  info:
    git:
      mode: full
  health:
    elasticsearch:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  file:
    path: ${user.home}/logs



---
spring:
  config:
    activate:
      on-profile: prod
logging:
  file:
    path: ${user.home}/logs

