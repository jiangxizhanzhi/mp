
apply from: 'config.gradle'

dependencies {
    implementation project(':mp-base')
    gradle.ext.appmodules.each {
        implementation project(":${it}")
    }
}

task createFileForJar {
    doLast {
        def process1 = 'git rev-parse --abbrev-ref HEAD'.execute()
        process1.waitFor() // 等待命令执行完成
        def branchName = "${process1.text.trim()}"

        def process2 = 'git rev-parse --short HEAD'.execute()
        process2.waitFor() // 等待命令执行完成
        def commitId = "${process2.text.trim()}"

        // 生成一个文件
        def file = new File("$buildDir/code_version.txt")
        file.text = "branch: $branchName\ncommit id : $commitId"
    }
}

bootJar {
    dependsOn createFileForJar
    from "$buildDir/code_version.txt"
    enabled = true
}

flyway {
    url = gradle.ext.flyway.url
    user = gradle.ext.flyway.user
    password = gradle.ext.flyway.password
    cleanDisabled = true
    outOfOrder = true
    locations = ['classpath:db/migration']
}
