<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE事件流接收器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        
        .description {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .controls {
            padding: 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        
        .url-input, .request-body {
            flex: 1;
            min-width: 250px;
        }
        
        input[type="text"], textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 1rem;
            font-family: monospace;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .input-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        #connectBtn {
            background-color: #28a745;
            color: white;
        }
        
        #connectBtn:hover {
            background-color: #218838;
        }
        
        #disconnectBtn {
            background-color: #dc3545;
            color: white;
        }
        
        #disconnectBtn:hover {
            background-color: #c82333;
        }
        
        #clearBtn {
            background-color: #6c757d;
            color: white;
        }
        
        #clearBtn:hover {
            background-color: #5a6268;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e9ecef;
            border-bottom: 1px solid #dee2e6;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #dc3545;
        }
        
        .connected .indicator {
            background-color: #28a745;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .events-container {
            padding: 20px;
        }
        
        .events-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        #eventsCount {
            background-color: #6c757d;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        
        #eventLog {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            padding: 15px;
            background-color: #f8f9fa;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
        }
        
        .event {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 5px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #4b6cb7;
        }
        
        .event-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #6c757d;
        }
        
        .event-type {
            font-weight: 600;
        }
        
        .event-data {
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .empty-log {
            text-align: center;
            color: #6c757d;
            padding: 40px 0;
        }
        
        .request-body-container {
            width: 100%;
            display: none;
        }
        
        .request-body-container.visible {
            display: block;
        }
        
        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
            }
            
            .url-input, .request-body {
                width: 100%;
            }
            
            .buttons {
                width: 100%;
            }
            
            button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SSE事件流接收器</h1>
            <p class="description">连接到Server-Sent Events (SSE)流并实时显示接收到的消息</p>
        </header>
        
        <div class="controls">
            <div class="url-input">
                <label class="input-label" for="urlInput">SSE端点URL</label>
                <input type="text" id="urlInput" placeholder="输入SSE端点URL" value="http://localhost:8080/api/mp/unauth/ai/chat/completions">
            </div>
            
            <div class="request-body-container" id="requestBodyContainer">
                <div class="request-body">
                    <label class="input-label" for="requestBody">请求体 (JSON)</label>
                    <textarea id="requestBody" placeholder='输入JSON请求体，例如: {"messages": [{"role": "user", "content": "Hello"}]}'></textarea>
                </div>
            </div>
            
            <div class="buttons">
                <button id="connectBtn">连接</button>
                <button id="disconnectBtn" disabled>断开</button>
                <button id="clearBtn">清空日志</button>
                <button id="toggleRequestBodyBtn">显示请求体</button>
            </div>
        </div>
        
        <div class="status">
            <div class="status-indicator">
                <div class="indicator"></div>
                <span id="statusText">未连接</span>
            </div>
            <div id="eventsCount">事件: 0</div>
        </div>
        
        <div class="events-container">
            <div class="events-header">
                <h2>事件日志</h2>
            </div>
            <div id="eventLog">
                <div class="empty-log">暂无事件，连接后事件将显示在这里</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlInput = document.getElementById('urlInput');
            const requestBody = document.getElementById('requestBody');
            const requestBodyContainer = document.getElementById('requestBodyContainer');
            const toggleRequestBodyBtn = document.getElementById('toggleRequestBodyBtn');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const clearBtn = document.getElementById('clearBtn');
            const statusText = document.getElementById('statusText');
            const eventsCount = document.getElementById('eventsCount');
            const eventLog = document.getElementById('eventLog');
            const statusIndicator = document.querySelector('.status-indicator');
            
            let eventSource = null;
            let eventCounter = 0;
            let isRequestBodyVisible = false;
            
            // 切换请求体输入框的可见性
            toggleRequestBodyBtn.addEventListener('click', function() {
                isRequestBodyVisible = !isRequestBodyVisible;
                if (isRequestBodyVisible) {
                    requestBodyContainer.classList.add('visible');
                    toggleRequestBodyBtn.textContent = '隐藏请求体';
                } else {
                    requestBodyContainer.classList.remove('visible');
                    toggleRequestBodyBtn.textContent = '显示请求体';
                }
            });
            
            // 更新连接状态
            function updateStatus(connected) {
                if (connected) {
                    statusText.textContent = '已连接';
                    statusIndicator.parentElement.classList.add('connected');
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                } else {
                    statusText.textContent = '未连接';
                    statusIndicator.parentElement.classList.remove('connected');
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                }
            }
            
            // 添加事件到日志
            function addEvent(type, data) {
                eventCounter++;
                eventsCount.textContent = `事件: ${eventCounter}`;
                
                // 移除空日志消息
                if (eventLog.querySelector('.empty-log')) {
                    eventLog.innerHTML = '';
                }
                
                const now = new Date();
                const timeString = now.toLocaleTimeString();
                
                const eventElement = document.createElement('div');
                eventElement.className = 'event';
                
                eventElement.innerHTML = `
                    <div class="event-header">
                        <span class="event-type">${type}</span>
                        <span class="event-time">${timeString}</span>
                    </div>
                    <div class="event-data">${data}</div>
                `;
                
                eventLog.prepend(eventElement);
            }
            
            // 连接到SSE
            function connect() {
                const url = urlInput.value.trim();
                if (!url) {
                    alert('请输入有效的SSE端点URL');
                    return;
                }
                
                // 检查请求体
                let requestBodyJson = null;
                if (isRequestBodyVisible && requestBody.value.trim()) {
                    try {
                        requestBodyJson = JSON.parse(requestBody.value.trim());
                    } catch (e) {
                        alert('请求体不是有效的JSON格式');
                        return;
                    }
                }
                
                // 使用fetch API发送POST请求（如果提供了请求体）
                if (requestBodyJson) {
                    console.log(12312312)
                    fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestBodyJson)
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP错误: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(data => {
                        addEvent('POST响应', data);
                    })
                    .catch(error => {
                        addEvent('错误', `POST请求失败: ${error.message}`);
                    });
                }
                
                // 使用EventSource进行SSE连接
                try {
                    eventSource = new EventSource(url);
                    
                    eventSource.onopen = function() {
                        updateStatus(true);
                        addEvent('连接已建立', `成功连接到: ${url}`);
                    };
                    
                    eventSource.onmessage = function(event) {
                        addEvent('消息', event.data);
                    };
                    
                    eventSource.onerror = function(error) {
                        addEvent('错误', `连接错误: ${error.type}`);
                        disconnect();
                    };
                    
                    // 监听自定义事件类型（如果有）
                    eventSource.addEventListener('customEvent', function(event) {
                        addEvent('自定义事件', event.data);
                    });
                    
                } catch (error) {
                    addEvent('错误', `连接失败: ${error.message}`);
                }
            }
            
            // 断开连接
            function disconnect() {
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                    updateStatus(false);
                    addEvent('连接已关闭', 'SSE连接已手动关闭');
                }
            }
            
            // 清空事件日志
            function clearLog() {
                eventLog.innerHTML = '<div class="empty-log">暂无事件，连接后事件将显示在这里</div>';
                eventCounter = 0;
                eventsCount.textContent = '事件: 0';
            }
            
            // 事件监听器
            connectBtn.addEventListener('click', connect);
            disconnectBtn.addEventListener('click', disconnect);
            clearBtn.addEventListener('click', clearLog);
            
            // 按Enter键触发连接
            urlInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    connect();
                }
            });
        });
    </script>
</body>
</html>
