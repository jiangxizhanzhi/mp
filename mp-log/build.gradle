dependencies {
    implementation project(':mp-base')
    implementation project(':mp-common')
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.4.2.Final'

}

apply plugin: "com.thinkimi.gradle.MybatisGenerator"

configurations {
    mybatisGenerator
}


mybatisGenerator {
    verbose =true
    configFile ='src/main/resources/mybatis/generator.xml'
    dependencies {
        mybatisGenerator 'org.mybatis.generator:mybatis-generator-core:1.3.7'
        mybatisGenerator 'org.mariadb.jdbc:mariadb-java-client:2.7.2'
        mybatisGenerator 'tk.mybatis:mapper:3.3.9'
    }
}