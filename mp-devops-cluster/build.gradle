dependencies {
    implementation project(':mp-base')
    implementation project(':mp-common')
    implementation project(':mp-auth')
    implementation project(':mp-front-admin')
    implementation project(':mp-log')
    implementation project(':mp-cscene')
    implementation project(':mp-scene-plugin-collection')
    implementation project(':mp-scene-plugin-cloud')
    implementation project(':mp-auth-base')
    implementation project(':mp-situation-aware')
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.4.2.Final'
    implementation 'com.azure:azure-identity:1.3.2'
    implementation 'com.azure.resourcemanager:azure-resourcemanager:2.6.0'
    implementation 'com.azure:azure-storage-blob:12.8.0'
    implementation 'com.microsoft.sqlserver:mssql-jdbc:6.2.1.jre8'
    implementation 'com.azure:azure-identity:1.3.2'
    implementation 'com.azure:azure-storage-blob:12.25.2'
    implementation 'com.azure:azure-security-keyvault-secrets:4.8.0'
}

compileJava {
    options.compilerArgs = [
            '-Amapstruct.suppressGeneratorTimestamp=true',
            '-Amapstruct.suppressGeneratorVersionInfoComment=true'
    ]
}
