image: java:11

stages:
  - build
  - deploy

build:
  stage: build
  script: gradle mp:build
  artifacts:
    paths:
      - mp/build/libs/mp-0.0.1.jar

production:
  stage: deploy
  script:
    - scp -rp server.jar <remote ip>:/usr/local/server
    - ssh <remote ip> bash start.sh
  only:
    - develop
