#子系统代码（密文）。新系统需要向公共组件室申请子系统代码。申请子系统后，在统一用户管理系统（http://172.17.252.65:22200/usermgmt/）中添加对应角色组、角色、功能码、用户等信息。
SysIdStr=F7EB8C529C1A503B79E729581EDBC95E

#白名单，不拦截，url之间逗号分隔（web应用自行设置）
#excludeUrl=/login

#取值(1（默认）|2|3)
#1的应用场景：根据客户端的选择进行校验，如果客户端选择了证书，则与服务端证书编号进行匹配;如果客户端没有选择证书则不匹配。
#2的应用场景：服务端给客户端已经颁发了证书，则客户端必须选中匹配的证书进行登录校验，如果没有颁发证书，则不需要使用证书校验。
#3的应用场景：服务端强制使用证书校验，没有证书则不通过
certLevel=1
#证书验证错误页面，如certificationLevel为1则该项无需配置
#如：certErrorPageUrl=/pages/error/certError.jsf
certErrorPageUrl=
#获取用户所用协议，默认版本仅支持magpie
sso_server_type=magpie
#################################
##以下配置项主要针对托管区，慎用#
#################################
#用于令牌有效性判断的服务地址转换
#需要转换的原始IP及转换后IP以逗号分隔。转换IP对之间以分号隔开。
#以下参数赋值仅为范例，请按具体网络拓扑结构做相应参数值设定，具体设定说明请参考[接入托管区SSO总结](http://172.17.254.218:3000/documents/81)
#validation_ip_mapping=172.21.22.81:17300,172.21.22.82:17300;172.21.22.81:17200,172.21.22.82:17300
#地址转换开关，开启后默认采用defaultSSOUrl参数值作为服务地址用于令牌有效性判断。取值为1表示开启，否则关闭。开启情况下，地址转换优先级高于validation_ip_mapping
#is_active_on_using_default_ssourl_for_validate_url=1