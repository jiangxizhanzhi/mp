magpie.config.file=magpie_ssoclient.xml
#SSO Magpie服务端地址，测试环境和生产环境根据实际地址修改。
#测试环境
magpie_sso_url=146.242.4.66:80
#Magpie服务注册中心集群地址(由注册中心分配服务端地址，优先级高于magpie_sso_url。当且仅当注册中心不可用，才会使用magpie_sso_url配置值作为默认.服务端地址)
#如果应用自身已经使用Magpie并有不同的注册中心地址，请将magpie_registry作为注册中心地址的键名，且必须配置参数magpie_sso_url赋值
#测试环境
magpie_registry=146.4.212.11:2181,146.4.212.12:2181,146.4.212.13:2181

